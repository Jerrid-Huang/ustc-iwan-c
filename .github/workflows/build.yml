# CI runs on ubuntu-latest with no TUN devices and no root, so the
# integration suite (make test -> tests/integration.sh, which needs both)
# runs only locally; this workflow gates compilation and smoke-tests the
# built binaries. -Werror is CI-only: regular builds append it to CFLAGS,
# while the sanitizer job omits it (ASan/UBSan-instrumented code trips
# known false-positive warnings) and relies on the same warning grep gate.
# The grep gates match 'error:' / 'warning:' (compiler diagnostic shape)
# rather than bare 'error|warning', which would also match the '-Werror'
# flag echoed on every make command line and fail the jobs spuriously.
name: build

on:
  push:
  pull_request:

# BASE_CFLAGS mirrors the Makefile defaults (CFLAGS ?=) so CI can append
# -Werror (regular builds) or sanitizer flags without editing the
# Makefile; keep this list in sync with the Makefile.
env:
  BASE_CFLAGS: -O2 -Wall -Wextra -std=c11 -D_GNU_SOURCE -fstack-protector-strong -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fPIE -MMD -MP -pthread

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev linux-libc-dev

      - name: Build (${{ matrix.cc }})
        run: |
          set -o pipefail
          make -B CC=${{ matrix.cc }} CFLAGS="$BASE_CFLAGS -Werror" 2>&1 | tee build-${{ matrix.cc }}.log
          if grep -Ei 'error:|warning:' build-${{ matrix.cc }}.log; then
            echo "::error::build emitted errors or warnings"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ matrix.cc }}
          path: build-${{ matrix.cc }}.log
          if-no-files-found: error

      - name: Incremental parallel build smoke
        run: |
          # make clean removes build-*.log, so regenerate it from the
          # incremental output (a full rebuild after clean) and gate it
          # the same way as the initial build.
          make clean
          set -o pipefail
          make -j$(nproc) CC=${{ matrix.cc }} CFLAGS="$BASE_CFLAGS -Werror" 2>&1 | tee build-${{ matrix.cc }}.log
          if grep -Ei 'error:|warning:' build-${{ matrix.cc }}.log; then
            echo "::error::incremental build emitted errors or warnings"
            exit 1
          fi

      - name: Smoke test
        run: |
          ./bin/iwan-client --help >/dev/null
          ./bin/iwan-client-oidc --help >/dev/null
          ./bin/iwan-server --help >/dev/null

      - name: Checksums
        run: sha256sum bin/iwan-client bin/iwan-client-oidc bin/iwan-server > SHASUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iwan-${{ matrix.cc }}
          path: |
            bin/iwan-client
            bin/iwan-client-oidc
            bin/iwan-server
            build-${{ matrix.cc }}.log
            SHASUMS.txt
          if-no-files-found: error

  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: sanitize-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev linux-libc-dev

      # ASan+UBSan build with gcc. No -Werror here: sanitizer
      # instrumentation trips known warnings; the grep gate below still
      # fails the job on any warning or error.
      - name: Build (ASan+UBSan, gcc)
        run: |
          set -o pipefail
          make -B CC=gcc \
            CFLAGS="$BASE_CFLAGS -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-pie -Wl,-z,now -Wl,-z,relro -Wl,-z,noexecstack -fsanitize=address,undefined" \
            2>&1 | tee build-sanitize.log
          if grep -Ei 'error:|warning:' build-sanitize.log; then
            echo "::error::sanitizer build emitted errors or warnings"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-sanitize
          path: build-sanitize.log
          if-no-files-found: error

      - name: Smoke test (sanitizers)
        run: |
          ./bin/iwan-client --help >/dev/null
          ./bin/iwan-client-oidc --help >/dev/null
          ./bin/iwan-server --help >/dev/null

  # Windows cross-compile: MinGW-w64 on Linux, gated by the same
  # warning/error grep as the native jobs. The OpenSSL dev package is the
  # MSYS2 ucrt64 one, unpacked under /tmp/mingw-sysroot exactly like the
  # local sysroot; OPENSSL_DIR points at its ucrt64 root and the Makefile
  # adds the include/lib dirs from it.
  win-cross:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: win-cross-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          # wine64 (not wine): the wine metapackage hard-depends on
          # wine32:i386, which needs the i386 architecture enabled; the
          # exes are x86-64 so the wine64 loader alone suffices. Note the
          # wine64 package installs /usr/lib/wine/wine64 but no 'wine64'
          # command — the smoke steps resolve the loader themselves.
          # linux-libc-dev is required by the wire-smoke step's Linux
          # rebuild (steer_bpf.c includes <linux/bpf.h>; the runner image
          # does not preinstall it), and clang compiles the BPF target.
          sudo apt-get install -y gcc-mingw-w64-x86-64 zstd wine64 clang linux-libc-dev linux-libc-dev

      - name: Download OpenSSL dev package (MSYS2 ucrt64)
        run: |
          # Pin matches the Makefile's documented cross-build sysroot
          # (README "Windows 交叉编译"); bump both together when a newer
          # MSYS2 OpenSSL is needed.
          curl -sL https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-openssl-3.5.1-1-any.pkg.tar.zst -o /tmp/ossl.tar.zst
          mkdir -p /tmp/mingw-sysroot
          tar --zstd -xf /tmp/ossl.tar.zst -C /tmp/mingw-sysroot

      - name: Build (win32 cross)
        run: |
          set -o pipefail
          make TARGET=win32 -B CC=x86_64-w64-mingw32-gcc \
            CFLAGS="-O2 -Wall -Wextra -std=c11 -fstack-protector-strong -MMD -MP -pthread -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 -Werror" \
            OPENSSL_DIR=/tmp/mingw-sysroot/ucrt64 2>&1 | tee build-win32.log
          if grep -Ei 'error:|warning:' build-win32.log; then
            echo "::error::win32 build emitted errors or warnings"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-win32
          path: build-win32.log
          if-no-files-found: error

      - name: Verify PE32+ binaries
        run: |
          file bin/iwan-client.exe bin/iwan-client-oidc.exe
          if ! file bin/iwan-client.exe | grep -q 'PE32+'; then
            echo "::error::bin/iwan-client.exe is not a PE32+ binary"
            exit 1
          fi
          if ! file bin/iwan-client-oidc.exe | grep -q 'PE32+'; then
            echo "::error::bin/iwan-client-oidc.exe is not a PE32+ binary"
            exit 1
          fi

      - name: Smoke test (wine)
        run: |
          set -e
          # The MSYS2 libcrypto/libssl are DLL import libs and the mingw
          # runtime pulls winpthread/ssp dynamically: drop every DLL the
          # exes import next to them so wine can load them.
          cp -f /tmp/mingw-sysroot/ucrt64/bin/libcrypto-3-x64.dll bin/
          cp -f /tmp/mingw-sysroot/ucrt64/bin/libssl-3-x64.dll bin/
          cp -f /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libwinpthread-1.dll bin/ 2>/dev/null || true
          cp -f /usr/lib/gcc/x86_64-w64-mingw32/*-posix/libssp-0.dll bin/ 2>/dev/null || true
          # The wine64 apt package installs only /usr/lib/wine/wine64
          # (the wine command lives in the wine metapackage, which needs
          # the i386 architecture); resolve the loader directly.
          WINE_BIN="$(command -v wine64 2>/dev/null || command -v wine 2>/dev/null || echo /usr/lib/wine/wine64)"
          echo "using wine loader: $WINE_BIN"
          ls -la bin/ | head -12
          "$WINE_BIN" --version 2>&1 | head -2 || true
          "$WINE_BIN" bin/iwan-client.exe --help
          "$WINE_BIN" bin/iwan-client-oidc.exe --help

      # Real wire-level smoke: a Linux iwan-server in --no-tun mode runs
      # without root (control plane only), and the Windows client talks
      # to it over UDP. This proves the frozen wire format and the
      # winsock port layer end to end (PING/PONG + OPEN/OPEN_ACK/CLOSE).
      - name: Wire smoke (Windows client <-> Linux server, wine)
        run: |
          set -e
          make -B -j$(nproc) CFLAGS="$BASE_CFLAGS" >/dev/null 2>&1
          printf 'alice:s3cret-pass\n' > /tmp/users.txt
          chmod 600 /tmp/users.txt
          ./bin/iwan-server --users /tmp/users.txt --port 16001 --no-tun \
            --user "$(whoami)" > /tmp/iwan-srv.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          sleep 1
          WINE_BIN="$(command -v wine64 2>/dev/null || command -v wine 2>/dev/null || echo /usr/lib/wine/wine64)"
          "$WINE_BIN" bin/iwan-client.exe ping --server 127.0.0.1 --port 16001 | grep -q 'PONG'
          "$WINE_BIN" bin/iwan-client.exe auth --server 127.0.0.1 --port 16001 \
            --user alice --pass s3cret-pass | grep -q 'OK sid='

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iwan-win32
          path: |
            bin/iwan-client.exe
            bin/iwan-client-oidc.exe
            bin/*.dll
            build-win32.log
          if-no-files-found: error
