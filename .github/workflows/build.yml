# CI matrix (all CMake now, no Makefile):
#   linux-native — x86_64 native, gcc + clang, -Werror
#   sanitize     — ASan+UBSan gcc build (no -Werror: sanitizer
#                  instrumentation trips known warnings; the grep gate
#                  below still fails on any warning/error)
#   linux-cross  — fully static musl binaries for every common Linux
#                  arch (x86_64, i686, aarch64, armv7, riscv64, ppc64le,
#                  s390x), qemu smoke where the arch is not runnable
#   win-cross    — MinGW-w64 static exes for Windows x86_64 + i686,
#                  wine smoke + real wire test (x86_64)
#   win-arm64    — Windows ARM64 via llvm-mingw (clang) + the prebuilt
#                  MSYS2 clangarm64 OpenSSL (no mingw-aarch64 Configure
#                  target exists in OpenSSL 3.x)
#   release      — tag-only: packages everything into per-arch archives
#
# The integration suite (tests/integration.sh) needs root + TUN devices
# and therefore runs only locally, via sudo.
#
# The grep gates match 'error:' / 'warning:' (compiler diagnostic
# shape) rather than bare 'error|warning', which would also match flag
# echo on command lines and fail jobs spuriously.
name: build

on:
  push:
  pull_request:
  # manual full run (bench included); release stays tag-gated
  workflow_dispatch:

jobs:
  linux-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      # matrix jobs share the group expression unless the cc dimension
      # is included: with cancel-in-progress, gcc and clang would
      # preempt each other and one matrix leg always got cancelled
      group: linux-native-${{ github.ref }}-${{ matrix.cc }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev linux-libc-dev

      - name: Configure
        run: cmake -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DIWAN_WERROR=ON

      - name: Build (${{ matrix.cc }})
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build-${{ matrix.cc }}.log
          if grep -Ei 'error:|warning:' build-${{ matrix.cc }}.log; then
            echo "::error::build emitted errors or warnings"
            exit 1
          fi

      - name: Show build failure tail (annotations)
        if: failure()
        run: |
          { echo "=== error-ish lines ==="
            grep -nE 'error|Error|Killed|killed|signal|No rule|failed|Segmentation|unable|interrupt' build-${{ matrix.cc }}.log | tail -15
            echo "=== last 6 lines ==="
            tail -6 build-${{ matrix.cc }}.log
            echo "=== toolchain ==="
            clang --version 2>/dev/null | head -1
            gcc --version 2>/dev/null | head -1
            cmake --version | head -1
            nproc
            echo "=== memory ==="
            free -h | head -2
            echo "=== oom killer (dmesg) ==="
            sudo dmesg 2>/dev/null | grep -iE 'killed process|out of memory' | tail -3 || true
          } | sed 's/^/::error::/'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ matrix.cc }}
          path: build-${{ matrix.cc }}.log
          if-no-files-found: error

      - name: Incremental parallel build smoke
        run: |
          # clean-first removes the previous objects AND the bin/
          # outputs; the rebuild exercises the incremental path from a
          # fresh tree and is gated the same way as the first build.
          set -o pipefail
          cmake --build build --clean-first -j"$(nproc)" 2>&1 | tee build-${{ matrix.cc }}.log
          if grep -Ei 'error:|warning:' build-${{ matrix.cc }}.log; then
            echo "::error::incremental build emitted errors or warnings"
            exit 1
          fi

      - name: Smoke test
        run: |
          ./bin/iwan-client --help >/dev/null
          ./bin/iwan-client-oidc --help >/dev/null
          ./bin/iwan-server --help >/dev/null

      - name: Checksums
        run: sha256sum bin/iwan-client bin/iwan-client-oidc bin/iwan-server > SHASUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iwan-${{ matrix.cc }}
          path: |
            bin/iwan-client
            bin/iwan-client-oidc
            bin/iwan-server
            build-${{ matrix.cc }}.log
            SHASUMS.txt
          if-no-files-found: error

  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: sanitize-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev linux-libc-dev

      # ASan+UBSan build with gcc. No -Werror here: sanitizer
      # instrumentation trips known warnings; the grep gate below still
      # fails the job on any warning or error.
      - name: Build (ASan+UBSan, gcc)
        run: |
          set -o pipefail
          cmake -B build-sanitize \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize -j"$(nproc)" 2>&1 | tee build-sanitize.log
          if grep -Ei 'error:|warning:' build-sanitize.log; then
            echo "::error::sanitizer build emitted errors or warnings"
            exit 1
          fi

      - name: Show build failure tail (annotations)
        if: failure()
        run: |
          { echo "=== error-ish lines ==="
            grep -nE 'error|Error|Killed|killed|signal|No rule|failed|Segmentation|unable|interrupt' build-sanitize.log | tail -15
            echo "=== last 6 lines ==="
            tail -6 build-sanitize.log
            echo "=== toolchain ==="
            gcc --version 2>/dev/null | head -1
            cmake --version | head -1
            nproc
            echo "=== memory ==="
            free -h | head -2
            echo "=== oom killer (dmesg) ==="
            sudo dmesg 2>/dev/null | grep -iE 'killed process|out of memory' | tail -3 || true
          } | sed 's/^/::error::/'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-sanitize
          path: build-sanitize.log
          if-no-files-found: error

      - name: Smoke test (sanitizers)
        run: |
          ./bin/iwan-client --help >/dev/null
          ./bin/iwan-client-oidc --help >/dev/null
          ./bin/iwan-server --help >/dev/null

  # Fully static musl binaries for every common Linux architecture:
  # zero glibc dependency, run on any Linux of that arch. The BPF
  # steering object is arch-neutral and compiles against the host's
  # linux headers (clang -target bpf), so it is embedded in all arches.
  linux-cross:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: linux-cross-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686, aarch64, armv7, riscv64, ppc64le, s390x]
        include:
          - arch: x86_64
            triplet: x86_64-linux-musl
            ct_triplet: x86_64-unknown-linux-musl
            openssl_target: linux-x86_64
            ossl_extra: ""
            qemu: ""
          - arch: i686
            triplet: i686-linux-musl
            ct_triplet: i686-unknown-linux-musl
            openssl_target: linux-x86
            ossl_extra: ""
            qemu: ""
          - arch: aarch64
            triplet: aarch64-linux-musl
            ct_triplet: aarch64-unknown-linux-musl
            openssl_target: linux-aarch64
            ossl_extra: ""
            qemu: qemu-aarch64
          - arch: armv7
            triplet: arm-linux-musleabihf
            ct_triplet: armv7-unknown-linux-musleabihf
            openssl_target: linux-armv4
            ossl_extra: ""
            qemu: qemu-arm
          - arch: riscv64
            triplet: riscv64-linux-musl
            ct_triplet: riscv64-unknown-linux-musl
            openssl_target: linux64-riscv64
            ossl_extra: ""
            qemu: qemu-riscv64
          - arch: ppc64le
            triplet: powerpc64le-linux-musl
            ct_triplet: powerpc64le-unknown-linux-musl
            openssl_target: linux-ppc64le
            ossl_extra: ""
            qemu: qemu-ppc64le
          - arch: s390x
            triplet: s390x-linux-musl
            ct_triplet: s390x-ibm-linux-musl
            openssl_target: linux64-s390x
            ossl_extra: no-asm
            qemu: qemu-s390x
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          # clang + linux-libc-dev: BPF payload compile (host headers).
          # qemu-user: run the static binaries of non-native arches.
          sudo apt-get install -y clang linux-libc-dev zstd
          if [ -n "${{ matrix.qemu }}" ]; then
            sudo apt-get install -y qemu-user
          fi

      - name: Download musl cross toolchain (${{ matrix.arch }})
        run: |
          # musl.cc first; GitHub runners have been observed timing out
          # against it for extended periods. Fall back to the GitHub-
          # hosted cross-tools/musl-cross mirror (same toolchain family)
          # and alias its <arch>-unknown-linux-musl-* prefixes to the
          # musl.cc-style triplet the build scripts expect.
          if ! curl -sL --retry 2 --max-time 120 \
              https://musl.cc/${{ matrix.triplet }}-cross.tgz -o /tmp/musl.tgz; then
            echo "musl.cc unreachable; falling back to cross-tools mirror"
            TAG="$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/cross-tools/musl-cross/releases/latest \
              | jq -r .tag_name)"
            [ -n "$TAG" ] && [ "$TAG" != "null" ]
            curl -sL --retry 3 --max-time 400 \
              "https://github.com/cross-tools/musl-cross/releases/download/${TAG}/${{ matrix.ct_triplet }}.tar.xz" \
              -o /tmp/musl.tgz
            mkdir -p /tmp/musl-x
            tar xJf /tmp/musl.tgz -C /tmp/musl-x
            chmod -R u+w /tmp/musl-x   # tarball ships read-only dirs
            # the tarball nests the toolchain one or two levels deep and
            # may carry multiple bin/ dirs; move the whole top-level
            # directory so bin + sysroot stay together
            TOPDIR="$(find /tmp/musl-x -mindepth 1 -maxdepth 1 -type d | head -1)"
            mkdir -p /opt/${{ matrix.triplet }}-cross
            mv "$TOPDIR"/* /opt/${{ matrix.triplet }}-cross/
            cd /opt/${{ matrix.triplet }}-cross/bin
            for f in ${{ matrix.ct_triplet }}-*; do
              alias_name="${{ matrix.triplet }}-${f#${{ matrix.ct_triplet }}-}"
              [ -e "$alias_name" ] || ln -s "$f" "$alias_name"
            done
          else
            tar xzf /tmp/musl.tgz -C /opt
          fi
          ls /opt/${{ matrix.triplet }}-cross/bin | head -3

      - name: Build static OpenSSL (${{ matrix.arch }})
        run: |
          OSSL_EXTRA=()
          if [ -n "${{ matrix.ossl_extra }}" ]; then
            OSSL_EXTRA+=(${{ matrix.ossl_extra }})
          fi
          ci/build-openssl.sh ${{ matrix.openssl_target }} \
            /opt/${{ matrix.triplet }}-cross/bin/${{ matrix.triplet }}- \
            /opt/ossl-${{ matrix.arch }} "${OSSL_EXTRA[@]}"

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/musl-linux-${{ matrix.arch }}.cmake \
            -DIWAN_MUSL_ROOT=/opt/${{ matrix.triplet }}-cross \
            -DIWAN_OPENSSL_DIR=/opt/ossl-${{ matrix.arch }} \
            -DIWAN_LINUX_STATIC=ON -DIWAN_WERROR=ON

      - name: Build (${{ matrix.arch }})
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build-${{ matrix.arch }}.log
          if grep -Ei 'error:|warning:' build-${{ matrix.arch }}.log; then
            echo "::error::${{ matrix.arch }} build emitted errors or warnings"
            exit 1
          fi

      - name: Verify static linkage (${{ matrix.arch }})
        run: |
          file bin/iwan-client bin/iwan-client-oidc bin/iwan-server
          if ! file bin/iwan-client | grep -q 'static-pie linked\|statically linked'; then
            echo "::error::bin/iwan-client is not fully static"
            exit 1
          fi
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            if objdump -T bin/iwan-client | grep -q GLIBC; then
              echo "::error::bin/iwan-client still depends on glibc"
              exit 1
            fi
          fi

      - name: Smoke test (${{ matrix.arch }})
        run: |
          RUN=""
          if [ -n "${{ matrix.qemu }}" ]; then
            RUN="${{ matrix.qemu }}"
          fi
          $RUN ./bin/iwan-client --help >/dev/null
          $RUN ./bin/iwan-client-oidc --help >/dev/null
          $RUN ./bin/iwan-server --help >/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iwan-linux-musl-${{ matrix.arch }}
          path: |
            bin/iwan-client
            bin/iwan-client-oidc
            bin/iwan-server
            build-${{ matrix.arch }}.log
          if-no-files-found: error

  # Windows cross-compile: MinGW-w64 on Linux, both x86_64 and i686,
  # static (exes embed OpenSSL + winpthread + libssp, no DLLs beside
  # them). OpenSSL no-asm: binutils' PE assembler rejects the ELF
  # directives in perlasm-generated .s files (observed with the mingw64
  # target; deterministic across binutils versions).
  win-cross:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: win-cross-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
        include:
          - arch: x86_64
            mingw_pkg: gcc-mingw-w64-x86-64
            openssl_target: mingw64
            prefix: x86_64-w64-mingw32-
            toolchain: windows-x86_64.cmake
            pe: "PE32+"
          - arch: i686
            mingw_pkg: gcc-mingw-w64-i686
            openssl_target: mingw
            prefix: i686-w64-mingw32-
            toolchain: windows-i686.cmake
            pe: "PE32 "
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          # wine64 (not wine): the wine metapackage hard-depends on
          # wine32:i386, which needs the i386 architecture enabled; the
          # x86_64 exes run under the wine64 loader alone. Note the
          # wine64 package installs /usr/lib/wine/wine64 but no 'wine64'
          # command — the smoke steps resolve the loader themselves.
          # linux-libc-dev + clang are required by the wire-smoke step's
          # Linux rebuild (steer_bpf.c includes <linux/bpf.h>).
          sudo apt-get install -y ${{ matrix.mingw_pkg }} zstd wine64 clang linux-libc-dev

      - name: Build static OpenSSL (${{ matrix.arch }})
        run: |
          ci/build-openssl.sh ${{ matrix.openssl_target }} \
            ${{ matrix.prefix }} /opt/ossl-${{ matrix.arch }} no-asm

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/${{ matrix.toolchain }} \
            -DIWAN_OPENSSL_DIR=/opt/ossl-${{ matrix.arch }} \
            -DIWAN_STATIC=ON -DIWAN_WERROR=ON

      - name: Build (${{ matrix.arch }})
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build-${{ matrix.arch }}.log
          if grep -Ei 'error:|warning:' build-${{ matrix.arch }}.log; then
            echo "::error::${{ matrix.arch }} build emitted errors or warnings"
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-win32-${{ matrix.arch }}
          path: build-${{ matrix.arch }}.log
          if-no-files-found: error

      - name: Verify PE binaries (${{ matrix.arch }})
        run: |
          file bin/iwan-client.exe bin/iwan-client-oidc.exe
          if ! file bin/iwan-client.exe | grep -q '${{ matrix.pe }}'; then
            echo "::error::bin/iwan-client.exe is not a ${{ matrix.pe }} binary"
            exit 1
          fi
          if ! file bin/iwan-client-oidc.exe | grep -q '${{ matrix.pe }}'; then
            echo "::error::bin/iwan-client-oidc.exe is not a ${{ matrix.pe }} binary"
            exit 1
          fi

      - name: Smoke test (wine, ${{ matrix.arch }})
        if: matrix.arch == 'x86_64'
        run: |
          set -eo pipefail
          # The exes are IWAN_STATIC: no DLLs needed next to them. The
          # wine64 apt package installs only /usr/lib/wine/wine64 (the
          # 'wine' wrapper needs wine32); resolve the loader directly.
          WINE_BIN="$(command -v wine64 2>/dev/null || { [ -x /usr/lib/wine/wine64 ] && echo /usr/lib/wine/wine64; } || command -v wine 2>/dev/null || true)"
          echo "using wine loader: $WINE_BIN" | tee /tmp/wine-smoke.log
          "$WINE_BIN" --version 2>&1 | tee -a /tmp/wine-smoke.log || true
          ls -la bin/ >> /tmp/wine-smoke.log
          "$WINE_BIN" bin/iwan-client.exe --help 2>&1 | tee -a /tmp/wine-smoke.log
          "$WINE_BIN" bin/iwan-client-oidc.exe --help 2>&1 | tee -a /tmp/wine-smoke.log

      - name: Show wine smoke failure details (annotations)
        if: failure()
        run: cat /tmp/wine-smoke.log | sed 's/^/::error::/' || true

      # Real wire-level smoke: a Linux iwan-server in --no-tun mode runs
      # without root (control plane only), and the Windows client talks
      # to it over UDP. This proves the frozen wire format and the
      # winsock port layer end to end (PING/PONG + OPEN/OPEN_ACK/CLOSE).
      - name: Wire smoke (Windows client <-> Linux server, wine)
        if: matrix.arch == 'x86_64'
        run: |
          set -e
          cmake -B build-linux >/dev/null
          cmake --build build-linux -j"$(nproc)" >/dev/null
          printf 'alice:s3cret-pass\n' > /tmp/users.txt
          chmod 600 /tmp/users.txt
          ./bin/iwan-server --users /tmp/users.txt --port 16001 --no-tun \
            --user "$(whoami)" > /tmp/iwan-srv.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          sleep 1
          # 24.04: no 'wine64' command, loader at /usr/lib/wine/wine64, and the
          # 'wine' wrapper demands wine32 (multiarch) even for 64-bit exes.
          # 26.04: 'wine64' command exists. Prefer in that order.
          WINE_BIN="$(command -v wine64 2>/dev/null || { [ -x /usr/lib/wine/wine64 ] && echo /usr/lib/wine/wine64; } || command -v wine 2>/dev/null || true)"
          "$WINE_BIN" bin/iwan-client.exe ping --server 127.0.0.1 --port 16001 | grep -q 'PONG'
          "$WINE_BIN" bin/iwan-client.exe auth --server 127.0.0.1 --port 16001 \
            --user alice --pass s3cret-pass | grep -q 'OK sid='

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iwan-win32-${{ matrix.arch }}
          path: |
            bin/iwan-client.exe
            bin/iwan-client-oidc.exe
            build-${{ matrix.arch }}.log
          if-no-files-found: error

  # Windows ARM64: OpenSSL has no mingw-aarch64 Configure target, so the
  # toolchain is llvm-mingw (clang) and the OpenSSL sysroot is the
  # prebuilt MSYS2 clangarm64 package. Link check + PE verification only
  # (no wine support for arm64 Windows binaries on Linux runners).
  win-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: win-arm64-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd jq

      - name: Download llvm-mingw toolchain
        run: |
          TAG="$(curl -s https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest \
            | jq -r .tag_name)"
          # asset naming changed across releases (ubuntu-20.04 -> 22.04);
          # pick whatever ucrt x86_64 tarball the latest release ships
          ASSET="$(curl -s https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest \
            | jq -r '.assets[].name | select(test("ucrt-ubuntu-.*-x86_64\\.tar\\.xz$"))' \
            | head -1)"
          echo "llvm-mingw $TAG asset $ASSET"
          [ -n "$ASSET" ]
          curl -sL --retry 3 --max-time 400 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${TAG}/${ASSET}" \
            -o /tmp/llvm-mingw.tar.xz
          mkdir -p /opt/llvm-mingw && tar xJf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Download MSYS2 clangarm64 OpenSSL
        run: |
          PKG="$(curl -s https://repo.msys2.org/mingw/clangarm64/ \
            | grep -oE 'mingw-w64-clang-aarch64-openssl-[0-9.]+-[0-9]+-any\.pkg\.tar\.zst' \
            | sort -V | tail -1)"
          echo "openssl package: $PKG"
          [ -n "$PKG" ]
          mkdir -p /opt/ossl-arm64
          curl -sL --retry 3 --max-time 400 \
            "https://repo.msys2.org/mingw/clangarm64/${PKG}" -o /tmp/ossl.pkg.tar.zst
          tar --zstd -xf /tmp/ossl.pkg.tar.zst -C /opt/ossl-arm64

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/windows-arm64.cmake \
            -DIWAN_OPENSSL_DIR=/opt/ossl-arm64/clangarm64 \
            -DIWAN_STATIC=ON -DIWAN_WERROR=ON

      - name: Build (arm64)
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build-arm64.log
          if grep -Ei 'error:|warning:' build-arm64.log; then
            echo "::error::arm64 build emitted errors or warnings"
            exit 1
          fi

      - name: Verify PE binaries (arm64)
        run: |
          file bin/iwan-client.exe bin/iwan-client-oidc.exe
          # GNU file prints the arch as "Aarch64" (older) or "aarch64"
          if ! file bin/iwan-client.exe | grep -qiE 'PE32\+.*(aarch64|arm64)'; then
            echo "::error::bin/iwan-client.exe is not a PE32+ aarch64 binary"
            exit 1
          fi
          if ! file bin/iwan-client-oidc.exe | grep -qiE 'PE32\+.*(aarch64|arm64)'; then
            echo "::error::bin/iwan-client-oidc.exe is not a PE32+ aarch64 binary"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iwan-win32-arm64
          path: |
            bin/iwan-client.exe
            bin/iwan-client-oidc.exe
            build-arm64.log
          if-no-files-found: error

  # macOS native client builds (no server: iwan-server is Linux-only).
  # Both Intel and Apple Silicon runners; OpenSSL comes from Homebrew
  # (keg-only, so OPENSSL_ROOT_DIR is passed explicitly). Wire smoke is
  # skipped: no iwan-server binary exists on macOS — the TUN/route
  # paths (utun + ifconfig/route) need root and are validated on real
  # Macs by users.
  macos:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    concurrency:
      group: macos-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-14
          - arch: arm64
            runner: macos-14-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          brew install openssl@3

      - name: Configure
        run: |
          cmake -B build \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DIWAN_WERROR=ON

      - name: Build (${{ matrix.arch }})
        run: |
          set -o pipefail
          cmake --build build -j"$(sysctl -n hw.ncpu)" 2>&1 | tee build-macos-${{ matrix.arch }}.log
          if grep -Ei 'error:|warning:' build-macos-${{ matrix.arch }}.log; then
            echo "::error::macOS build emitted errors or warnings"
            exit 1
          fi

      - name: Show build failure tail (annotations)
        if: failure()
        run: |
          { echo "=== error-ish lines ==="
            grep -nE 'error|Error|Killed|killed|signal|No rule|failed|Segmentation|unable|interrupt' build-macos-${{ matrix.arch }}.log | tail -15
            echo "=== last 6 lines ==="
            tail -6 build-macos-${{ matrix.arch }}.log
            echo "=== toolchain ==="
            clang --version 2>/dev/null | head -1
            cmake --version | head -1
            sysctl -n hw.ncpu hw.memsize
          } | sed 's/^/::error::/'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-macos-${{ matrix.arch }}
          path: build-macos-${{ matrix.arch }}.log
          if-no-files-found: error

      - name: Verify Mach-O binaries (${{ matrix.arch }})
        run: |
          file bin/iwan-client bin/iwan-client-oidc
          if ! file bin/iwan-client | grep -qiE 'Mach-O.*(${{ matrix.arch }}|arm64|x86_64)'; then
            echo "::error::bin/iwan-client is not a Mach-O ${{ matrix.arch }} binary"
            exit 1
          fi

      - name: Smoke test
        run: |
          ./bin/iwan-client --help >/dev/null
          ./bin/iwan-client-oidc --help >/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iwan-macos-${{ matrix.arch }}
          path: |
            bin/iwan-client
            bin/iwan-client-oidc
            build-macos-${{ matrix.arch }}.log
          if-no-files-found: error

  # Rootless control-plane benchmark (no TUN/root needed): local
  # iwan-server (--no-tun) + ping RTT / auth handshake latency stats.
  # The results are attached to the release notes (release needs this
  # job). Real data-plane throughput needs TUN devices + root and stays
  # local (sudo tests/bench.sh).
  bench:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: bench-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev linux-libc-dev

      - name: Build
        run: |
          cmake -B build
          cmake --build build -j"$(nproc)"

      - name: Run control-plane benchmark
        run: ci/bench-control.sh

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results
          path: bench-results.md
          if-no-files-found: error

  # Publish a GitHub Release on tag pushes (v*): Linux binaries built
  # here (deliberately NOT via needs: linux-native — the matrix job is
  # cancelled as a unit whenever any matrix leg is preempted, which
  # would skip the release), musl + Windows binaries from the artifacts.
  # Trigger with:
  #   git tag v0.1.0 && git push origin v0.1.0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-cross, win-cross, win-arm64, macos, bench]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Build Linux binaries (glibc x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev linux-libc-dev
          cmake -B build
          cmake --build build -j"$(nproc)"

      - name: Download musl binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: iwan-linux-musl-*
          path: musl/

      - name: Download Windows binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: iwan-win32-*
          path: win32/

      - name: Download macOS binaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: iwan-macos-*
          path: macos/

      - name: Download benchmark results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: bench-results
          path: .

      - name: Package release archives
        run: |
          set -e
          mkdir -p dist/linux dist/windows

          # glibc x86_64 (dynamically linked against system libssl)
          cp bin/iwan-client bin/iwan-client-oidc bin/iwan-server dist/linux/
          (cd dist/linux && tar czf ../iwan-linux-x86_64.tar.gz \
            iwan-client iwan-client-oidc iwan-server)

          # musl static: one archive per arch, raw binaries beside them
          # (download-artifact keeps upload-time paths: musl/iwan-linux-musl-<arch>/bin/*)
          for d in musl/*/; do
            artifact="$(basename "$d")"
            arch="${artifact#iwan-linux-musl-}"
            cp "$d/bin/iwan-client" "$d/bin/iwan-client-oidc" "$d/bin/iwan-server" dist/linux/
            mv dist/linux/iwan-client    "dist/linux/iwan-client-${arch}-musl"
            mv dist/linux/iwan-client-oidc "dist/linux/iwan-client-oidc-${arch}-musl"
            mv dist/linux/iwan-server    "dist/linux/iwan-server-${arch}-musl"
            # x86_64 keeps the historical archive name for compat
            if [ "$arch" = "x86_64" ]; then
              (cd dist/linux && tar czf ../iwan-linux-x86_64-musl.tar.gz \
                iwan-client-x86_64-musl iwan-client-oidc-x86_64-musl iwan-server-x86_64-musl)
            else
              (cd dist/linux && tar czf "../iwan-linux-${arch}-musl.tar.gz" \
                iwan-client-${arch}-musl iwan-client-oidc-${arch}-musl iwan-server-${arch}-musl)
            fi
          done

          # Windows static exes (win32/iwan-win32-<arch>/bin/*.exe)
          for d in win32/*/; do
            artifact="$(basename "$d")"
            arch="${artifact#iwan-win32-}"
            mkdir -p "dist/windows/${arch}"
            cp "$d/bin/iwan-client.exe" "$d/bin/iwan-client-oidc.exe" "dist/windows/${arch}/"
            if [ "$arch" = "x86_64" ]; then
              (cd "dist/windows/${arch}" && zip -qr "../../iwan-windows-x86_64.zip" .)
            else
              (cd "dist/windows/${arch}" && zip -qr "../../iwan-windows-${arch}.zip" .)
            fi
          done

          # macOS native binaries (macos/iwan-macos-<arch>/bin/*)
          for d in macos/*/; do
            artifact="$(basename "$d")"
            arch="${artifact#iwan-macos-}"
            mkdir -p "dist/macos/${arch}"
            cp "$d/bin/iwan-client" "$d/bin/iwan-client-oidc" "dist/macos/${arch}/"
            (cd "dist/macos/${arch}" && zip -qr "../../iwan-macos-${arch}.zip" .)
          done

          find dist -type f | sort

      - name: Stage per-arch bare exes
        run: |
          # bare exes from every windows arch would collide on the same
          # asset name in the release upload; give each arch a suffix
          for d in dist/windows/*/; do
            arch="$(basename "$d")"
            cp "$d/iwan-client.exe" "dist/iwan-client-${arch}.exe"
            cp "$d/iwan-client-oidc.exe" "dist/iwan-client-oidc-${arch}.exe"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            dist/iwan-linux-x86_64.tar.gz
            dist/iwan-linux-x86_64-musl.tar.gz
            dist/iwan-linux-i686-musl.tar.gz
            dist/iwan-linux-aarch64-musl.tar.gz
            dist/iwan-linux-armv7-musl.tar.gz
            dist/iwan-linux-riscv64-musl.tar.gz
            dist/iwan-linux-ppc64le-musl.tar.gz
            dist/iwan-linux-s390x-musl.tar.gz
            dist/iwan-windows-x86_64.zip
            dist/iwan-windows-i686.zip
            dist/iwan-windows-arm64.zip
            dist/iwan-macos-x86_64.zip
            dist/iwan-macos-arm64.zip
            dist/linux/iwan-client
            dist/linux/iwan-client-oidc
            dist/linux/iwan-server
            dist/linux/iwan-client-*-musl
            dist/linux/iwan-server-*-musl
            dist/iwan-client-x86_64.exe
            dist/iwan-client-i686.exe
            dist/iwan-client-arm64.exe
            dist/iwan-client-oidc-x86_64.exe
            dist/iwan-client-oidc-i686.exe
            dist/iwan-client-oidc-arm64.exe
          generate_release_notes: true
          # append the CI control-plane benchmark table to the auto notes
          append_body: true
          body_path: bench-results.md
