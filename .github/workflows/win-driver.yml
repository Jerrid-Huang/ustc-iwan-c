# Build pipeline for the Windows kernel driver (WFP callout data plane).
#
# Why a separate workflow: neither the dev machine (Linux) nor the test machine (nano11 VM) has
# WDK/MSVC, so the compiler can only come from a GitHub windows runner (image ships VS + WDK).
# Locally we only compare the testable layer (tests/win_frame_test.c); the VM signs/loads/integrates.
#
# Trigger: runs only when win-driver/**, the shared ABI header or this file change; manual runs too,
# e.g. after a driver change `gh workflow run win-driver.yml --ref <branch>` reruns just this,
# without dragging in the full build.yml platform matrix.
name: win-driver

on:
  workflow_dispatch:
  push:
    paths:
      - 'win-driver/**'
      - 'src/common/iwan_win_abi.h'
      - '.github/workflows/win-driver.yml'

permissions:
  contents: read

jobs:
  wdk:
    runs-on: windows-2022
    concurrency:
      group: win-driver-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Probe toolchain (VS / WDK / headers / libs)
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE\env.log"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          # 64-bit MSBuild: the 32-bit one loads x86\InfVerif.dll (WDK ships only x64),
          # so the INF verification step throws "Unable to load DLL 'x86\InfVerif.dll'".
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
                     -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) {
            $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
                       -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          }
          "VSDIR=$vs"       | Tee-Object -FilePath $log -Append
          "MSBUILD=$msbuild" | Tee-Object -FilePath $log -Append
          "VSDIR=$vs"        >> $env:GITHUB_ENV
          "MSBUILD=$msbuild" >> $env:GITHUB_ENV

          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          # Note: $sdk\Include also contains wdf besides version dirs; sorting by name puts wdf last,
          # so ntddk.h/fwpsk.h are all missed -- match only 10.* and sort by version number.
          $inc = Get-ChildItem "$sdk\Include" -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -match '^10\.' } |
                 Sort-Object { [version]$_.Name } | Select-Object -Last 1
          "WDKINC=$($inc.FullName)" | Tee-Object -FilePath $log -Append
          "WDKINC=$($inc.FullName)" >> $env:GITHUB_ENV

          $probe = @(
            @{ n = 'sdk include versions'; v = (Get-ChildItem "$sdk\Include" -Directory -ErrorAction SilentlyContinue | Select-Object -Expand Name) -join ',' },
            @{ n = 'km\fwpsk.h';       v = (Test-Path "$($inc.FullName)\km\fwpsk.h") },
            @{ n = 'km\ndis.h';        v = (Test-Path "$($inc.FullName)\km\ndis.h") },
            @{ n = 'km\wdmsec.h';      v = (Test-Path "$($inc.FullName)\km\wdmsec.h") },
            @{ n = 'km\stdint.h';      v = (Test-Path "$($inc.FullName)\km\stdint.h") },
            @{ n = 'km\crt\stdint.h';  v = (Test-Path "$($inc.FullName)\km\crt\stdint.h") },
            @{ n = 'fwpkclnt.lib';     v = (Get-ChildItem "$sdk\Lib" -Recurse -Filter fwpkclnt.lib -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' },
            @{ n = 'ndis.lib';         v = (Get-ChildItem "$sdk\Lib" -Recurse -Filter ndis.lib -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' },
            @{ n = 'wdmsec.lib';       v = (Get-ChildItem "$sdk\Lib" -Recurse -Filter wdmsec.lib -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' },
            @{ n = 'devcon.exe';       v = (Get-ChildItem "$sdk\Tools" -Recurse -Filter devcon.exe -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' },
            @{ n = 'driver toolset props';  v = (Get-ChildItem "$vs\MSBuild" -Recurse -Filter 'WindowsKernelModeDriver*.props' -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' }
          )
          foreach ($p in $probe) { "$($p.n) = $($p.v)" | Tee-Object -FilePath $log -Append }

      # cl syntax check first: /Zs only parses, produces no object and does not link, so it does not depend
      # on the driver toolset being installed. It dumps every compile error before msbuild, saving round trips.
      - name: cl syntax check (non-blocking, just to collect all errors)
        continue-on-error: true
        shell: pwsh
        run: |
          $msvc = Get-ChildItem "$env:VSDIR\VC\Tools\MSVC" -Directory |
                  Sort-Object Name | Select-Object -Last 1
          $cl = Get-ChildItem $msvc.FullName -Recurse -Filter cl.exe |
                Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          "CL=$($cl.FullName)"
          $incs = @("$env:WDKINC\km", "$env:WDKINC\km\crt", "$env:WDKINC\shared",
                    "$env:WDKINC\ucrt", "$($msvc.FullName)\include") |
                  Where-Object { Test-Path $_ } | ForEach-Object { "/I$_" }
          $common = @('/nologo', '/kernel', '/c', '/Zs', '/std:c11', '/W4', '/WX-',
                      '/Iwin-driver', '/Isrc\common') + $incs + @('/D_AMD64_')
          # WFP plane (iwan.sys)
          $clArgs = $common + @('/DNDIS630') +
                  @('win-driver\iwan_win_drv.c', 'win-driver\iwan_win_session.c',
                    'win-driver\iwan_win_wfp.c', 'win-driver\iwan_win_frame.c')
          & $cl.FullName @clArgs 2>&1 | Tee-Object -FilePath cl-syntax.log
          "cl exit code=$LASTEXITCODE"
          # NDIS plane (iwanmp.sys). ndis.h miniport macros and protocol macros cannot both be enabled,
          # so iwan_win_mp.c runs separately; the other sources use protocol/common macros.
          $mpArgs = $common + @('/DNDIS630', '/DNDIS_WDM', '/DIWAN_WIN_PLANE_MP') +
                  @('win-driver\iwan_win_proto.c', 'win-driver\iwan_win_mpdata.c',
                    'win-driver\iwan_win_drv.c', 'win-driver\iwan_win_session.c',
                    'win-driver\iwan_win_frame.c')
          & $cl.FullName @mpArgs 2>&1 | Tee-Object -FilePath cl-mp.log
          "cl mp exit code=$LASTEXITCODE"
          $mpoArgs = $common + @('/DNDIS_MINIPORT_DRIVER', '/DNDIS620_MINIPORT',
                                 '/DNDIS683_MINIPORT',
                                 '/DNDIS_WDM', '/DIWAN_WIN_PLANE_MP') +
                  @('win-driver\iwan_win_mp.c')
          & $cl.FullName @mpoArgs 2>&1 | Tee-Object -FilePath cl-mp-miniport.log
          "cl mp-miniport exit code=$LASTEXITCODE"
          # Count NIC (iwancnt.sys): self-contained miniport, miniport macro family only.
          $cntArgs = $common + @('/DNDIS_MINIPORT_DRIVER', '/DNDIS620_MINIPORT',
                                 '/DNDIS683_MINIPORT', '/DNDIS_WDM') +
                  @('win-driver\iwan_cnt.c')
          & $cl.FullName @cntArgs 2>&1 | Tee-Object -FilePath cl-cnt.log
          "cl cnt exit code=$LASTEXITCODE"

      # Dump the API prototypes/struct members I am unsure about straight from the WDK headers: guessing
      # signatures caused repeated failures last time (I "fixed" FwpsInjectNetworkReceiveAsync0 wrong).
      - name: Look up prototypes and struct members in the WDK headers
        continue-on-error: true
        shell: pwsh
        run: |
          $h = "$env:WDKINC\km"
          $log = "$env:GITHUB_WORKSPACE\api-probe.log"
          function P($title, $file, $pattern, $after) {
            "`n=== $title ===" | Tee-Object -FilePath $log -Append
            if (Test-Path $file) {
              Select-String -Path $file -Pattern $pattern -Context 0, $after |
                Select-Object -First 3 | Out-String -Width 240 |
                Tee-Object -FilePath $log -Append
            } else { "missing file $file" | Tee-Object -FilePath $log -Append }
          }
          P 'FWPS_INJECT_COMPLETE0 definition' "$h\fwpsk.h" 'typedef.*FWPS_INJECT_COMPLETE0' 3
          P 'FwpsInjectNetworkReceiveAsync0 prototype' "$h\fwpsk.h" 'FwpsInjectNetworkReceiveAsync0' 12
          P 'FWPS_INCOMING_METADATA_VALUES0 index/interface members' "$h\fwpsk.h" 'incomingInterfaceIndex|interfaceIndex|subInterfaceIndex' 1
          P 'FWPM_FILTER0 context members' "$h\fwpmk.h" 'rawContext|providerContextKey' 2
          P 'NdisAllocateNetBufferListPool prototype' "$h\ndis.h" 'NdisAllocateNetBufferListPool\(' 6
          P 'NET_BUFFER_LIST_POOL_PARAMETERS definition' "$h\ndis\nbl.h" 'typedef struct _NET_BUFFER_LIST_POOL_PARAMETERS' 12
          "`n=== which header declares KeStackAttachProcess ===" | Tee-Object -FilePath $log -Append
          Get-ChildItem $h -Filter '*.h' | ForEach-Object {
            if (Select-String -Path $_.FullName -Pattern 'KeStackAttachProcess' -Quiet) { $_.Name }
          } | Tee-Object -FilePath $log -Append

      # Before writing the NDIS miniport + protocol driver, dump the contracts from the WDK headers one by one.
      # Last round's lesson was "guessing signatures": I "fixed" FwpsInjectNetworkReceiveAsync0 by guessing
      # and wasted a CI run. Here we fetch all needed prototypes/structs/macros in one go.
      - name: Look up NDIS miniport and protocol driver contracts in the WDK
        continue-on-error: true
        shell: pwsh
        run: |
          $h = "$env:WDKINC\km"
          $log = "$env:GITHUB_WORKSPACE\ndis-probe.log"
          function PA($title, $pattern, $ctx, $max) {
            "`n=== $title ===" | Tee-Object -FilePath $log -Append
            Get-ChildItem $h -Recurse -Filter '*.h' -ErrorAction SilentlyContinue |
              Select-String -Pattern $pattern -ErrorAction SilentlyContinue |
              Select-Object -First $max | ForEach-Object {
                "$($_.Filename):$($_.LineNumber): $($_.Line)"
                if ($ctx -gt 0) {
                  Get-Content $_.Path | Select-Object -Skip $_.LineNumber -First $ctx
                }
              } | Out-String -Width 240 | Tee-Object -FilePath $log -Append
          }
          PA 'NdisRegisterProtocolDriver prototype' 'NdisRegisterProtocolDriver\(' 8 1
          PA 'NDIS_PROTOCOL_DRIVER_CHARACTERISTICS struct' 'typedef struct _NDIS_PROTOCOL_DRIVER_CHARACTERISTICS' 52 1
          PA 'PROTOCOL_DRIVER_CHARACTERISTICS Revision/Size macros' 'NDIS_SIZEOF_PROTOCOL_DRIVER_CHARACTERISTICS_REVISION' 1 6
          PA 'NdisSendNetBufferLists prototype' 'NdisSendNetBufferLists\(' 8 1
          PA 'NdisOpenAdapterEx prototype' 'NdisOpenAdapterEx\(' 10 1
          PA 'NDIS_MINIPORT_DRIVER_CHARACTERISTICS struct' 'typedef struct _NDIS_MINIPORT_DRIVER_CHARACTERISTICS' 52 1
          PA 'MINIPORT_DRIVER_CHARACTERISTICS Revision/Size macros' 'NDIS_SIZEOF_MINIPORT_DRIVER_CHARACTERISTICS_REVISION' 1 6
          PA 'NdisMRegisterMiniportDriver prototype' 'NdisMRegisterMiniportDriver\(' 8 1
          PA 'NdisMDeregisterMiniportDriver prototype' 'NdisMDeregisterMiniportDriver\(' 4 1
          PA 'NdisMIndicateReceiveNetBufferLists prototype' 'NdisMIndicateReceiveNetBufferLists\(' 10 1
          PA 'NdisMSendNetBufferListsComplete prototype' 'NdisMSendNetBufferListsComplete\(' 6 1
          PA 'NDIS_MINIPORT_ADAPTER_GENERAL_ATTRIBUTES struct' 'typedef struct _NDIS_MINIPORT_ADAPTER_GENERAL_ATTRIBUTES' 45 1
          PA 'NDIS_MINIPORT_ADAPTER_REGISTRATION_ATTRIBUTES struct' 'typedef struct _NDIS_MINIPORT_ADAPTER_REGISTRATION_ATTRIBUTES' 16 1
          PA 'NdisMSetMiniportAttributes prototype' 'NdisMSetMiniportAttributes\(' 6 1
          PA 'NET_BUFFER_LIST_POOL_PARAMETERS struct' 'typedef struct _NET_BUFFER_LIST_POOL_PARAMETERS' 18 1
          PA 'ProtocolReceiveNetBufferLists prototype' 'ProtocolReceiveNetBufferLists\(' 12 1
          PA 'ProtocolSendNetBufferListsComplete prototype' 'ProtocolSendNetBufferListsComplete\(' 12 1
          PA 'NdisReturnNetBufferLists prototype' 'NdisReturnNetBufferLists\(' 6 1
          PA 'NdisAllocateNetBuffer prototype' 'NdisAllocateNetBuffer\(' 6 1
          PA 'NdisAllocateNetBufferList prototype' 'NdisAllocateNetBufferList\(' 6 1
          PA 'NET_BUFFER_FIRST_MDL macro' 'define NET_BUFFER_FIRST_MDL' 1 1
          PA 'NDIS_RECEIVE_FLAGS constants' 'define NDIS_RECEIVE_FLAGS_' 1 6
          PA 'NDIS_INTERFACE_INFORMATION struct' 'typedef struct _NDIS_INTERFACE_INFORMATION' 30 1
          PA 'OID_GEN_INTERFACE_INFO definition' 'define OID_GEN_INTERFACE_INFO' 1 1
          PA 'OID_GEN_MAXIMUM_FRAME_SIZE/TOTAL_SIZE definition' 'define OID_GEN_MAXIMUM_(FRAME_SIZE|TOTAL_SIZE)' 1 2
          PA 'GetBestRoute2 declaration' 'GetBestRoute2' 8 1
          PA 'MIB_IPFORWARD_ROW2 struct' 'typedef struct _MIB_IPFORWARD_ROW2' 26 1
          PA 'ConvertInterfaceIndexToLuid declaration' 'ConvertInterfaceIndexToLuid\(' 6 1
          PA 'ConvertInterfaceLuidToIndex declaration' 'ConvertInterfaceLuidToIndex\(' 6 1
          PA 'NdisIfGetNetLuid family' 'NdisIfGetNetLuid' 4 2
          PA 'NdisMNetPnPEvent prototype' 'NdisMNetPnPEvent\(' 6 1
          PA 'conditional use of NDIS_*_DRIVER macros in ndis.h' '#if.*NDIS_(MINIPORT|PROTOCOL|FILTER)_DRIVER' 2 6
          PA 'use of the NDIS_WDM macro' 'defined\(NDIS_WDM\)' 2 3

          # Round 2: macro gates, handler prototypes, OIDs and route headers (round 1 missed them under km\,
          # so this round searches the whole Include tree). In ndis.h, NDIS_MINIPORT_DRIVER hit an
          # "#error ... macro is reserved" line; we must see what condition guards it,
          # otherwise which macros the project should define is pure guesswork.
          $root = Split-Path $env:WDKINC -Parent
          function P2($title, $pattern, $ctx, $max) {
            "`n=== $title ===" | Tee-Object -FilePath $log -Append
            Get-ChildItem $root -Recurse -Filter '*.h' -ErrorAction SilentlyContinue |
              Select-String -Pattern $pattern -ErrorAction SilentlyContinue |
              Select-Object -First $max | ForEach-Object {
                "$($_.Path):$($_.LineNumber): $($_.Line)"
                if ($ctx -gt 0) {
                  Get-Content $_.Path | Select-Object -Skip $_.LineNumber -First $ctx
                }
              } | Out-String -Width 240 | Tee-Object -FilePath $log -Append
          }
          function R2($title, $file, $start, $count) {
            "`n=== $title ($file : $start +$count) ===" | Tee-Object -FilePath $log -Append
            $p = Join-Path $h $file
            if (Test-Path $p) {
              Get-Content $p | Select-Object -Skip ($start - 1) -First $count |
                Out-String -Width 200 | Tee-Object -FilePath $log -Append
            } else { "no such file $p" | Tee-Object -FilePath $log -Append }
          }
          R2 'ndis.h macro gates (version and reserved macros)' 'ndis.h' 150 210
          R2 'ndis.h protocol version macro inference' 'ndis.h' 750 60
          R2 'ndis.h miniport version macro inference' 'ndis.h' 900 70
          P2 'RECEIVE_NET_BUFFER_LISTS_HANDLER prototype' 'RECEIVE_NET_BUFFER_LISTS_HANDLER\)' 14 1
          P2 'SEND_NET_BUFFER_LISTS_COMPLETE_HANDLER prototype' 'SEND_NET_BUFFER_LISTS_COMPLETE_HANDLER\)' 12 1
          P2 'BIND_HANDLER_EX prototype' 'BIND_HANDLER_EX\)' 14 1
          P2 'UNBIND_HANDLER_EX prototype' 'UNBIND_HANDLER_EX\)' 10 1
          P2 'OPEN_ADAPTER_COMPLETE_HANDLER_EX prototype' 'OPEN_ADAPTER_COMPLETE_HANDLER_EX\)' 10 1
          P2 'CLOSE_ADAPTER_COMPLETE_HANDLER_EX prototype' 'CLOSE_ADAPTER_COMPLETE_HANDLER_EX\)' 10 1
          P2 'NDIS_BIND_PARAMETERS struct' 'typedef struct _NDIS_BIND_PARAMETERS' 40 1
          P2 'NDIS_OPEN_PARAMETERS struct' 'typedef struct _NDIS_OPEN_PARAMETERS' 18 1
          P2 'NdisOidRequest prototype' 'NdisOidRequest\(' 8 1
          P2 'NDIS_OID_REQUEST struct' 'typedef struct _NDIS_OID_REQUEST' 40 1
          P2 'NDIS_INTERFACE_INFORMATION struct' 'typedef struct _NDIS_INTERFACE_INFORMATION' 30 1
          P2 'OID_GEN_INTERFACE_INFO definition' 'define OID_GEN_INTERFACE_INFO' 1 1
          P2 'OID_GEN_MAXIMUM_TOTAL_SIZE definition' 'define OID_GEN_MAXIMUM_TOTAL_SIZE' 1 1
          P2 'OID_GEN_CURRENT_PACKET_FILTER definition' 'define OID_GEN_CURRENT_PACKET_FILTER' 1 1
          P2 'OID_GEN_STATISTICS definition' 'define OID_GEN_STATISTICS' 1 1
          P2 'OID_802_3_CURRENT_ADDRESS definition' 'define OID_802_3_CURRENT_ADDRESS' 1 1
          P2 'NDIS_STATISTICS_INFO struct' 'typedef struct _NDIS_STATISTICS_INFO' 26 1
          P2 'NDIS_LINK_STATE struct' 'typedef struct _NDIS_LINK_STATE' 16 1
          P2 'NdisMIndicateStatusEx prototype' 'NdisMIndicateStatusEx\(' 6 1
          P2 'GetBestRoute2 declaration' 'GetBestRoute2\(' 10 1
          P2 'MIB_IPFORWARD_ROW2 struct' 'typedef struct _MIB_IPFORWARD_ROW2' 26 1
          P2 'ConvertInterfaceLuidToIndex declaration' 'ConvertInterfaceLuidToIndex\(' 6 1
          P2 'NET_LUID struct' 'typedef struct _NET_LUID' 10 1
          P2 'ExInitializeDriverRuntime prototype' 'ExInitializeDriverRuntime\(' 4 1
          P2 'NdisAllocateNetBufferAndNetBufferList prototype' 'NdisAllocateNetBufferAndNetBufferList\(' 8 1
          P2 'NdisMQueryAdapterInstanceName/interface helpers' 'NdisMQueryAdapterInstanceName\(' 6 1
          # Round 4: NdisMRegisterMiniportDriver returns 0xC0010005 on the guest; we must know
          # that name; also copy the original headers into the artifact so we can grep locally later.
          P2 'NDIS_STATUS 0xC00100xx definitions' 'define +NDIS_STATUS_[A-Z_0-9]+ +\(' 1 40
          P2 'NDIS_RUNTIME_VERSION_ definitions' 'define +NDIS_RUNTIME_VERSION_' 1 40
          P2 'NDIS_MINIPORT_DRIVER_CHARACTERISTICS_REVISION definitions' 'define +NDIS_SIZEOF_MINIPORT_DRIVER_CHARACTERISTICS_REVISION_' 1 20
          # Round 5: the control device is now created by NdisRegisterDeviceEx (measured on the guest:
          # NdisMRegisterMiniportDriver returns 0xC0010005 when DriverObject already has its own device).
          # Which constant goes into NDIS_DEVICE_OBJECT_ATTRIBUTES.Header.Type?
          P2 'NDIS_OBJECT_TYPE_DEVICE_OBJECT_ATTRIBUTES definition' 'define +NDIS_OBJECT_TYPE_DEVICE_OBJECT_ATTRIBUTES' 1 6
          P2 'NDIS_OBJECT_TYPE_DEFAULT definition' 'define +NDIS_OBJECT_TYPE_DEFAULT' 1 6
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\wdk-src" | Out-Null
          # Note ntddndis.h is not under km\ but under shared\: the NDIS_OID_REQUEST struct body,
          # NDIS_SIZEOF_OID_REQUEST_REVISION_1 and the NdisRequestSetInformation enum all live
          # there; ndis.h only forward-declares them. Round 1 took only from km\ and came back with none.
          foreach ($f in @('ndis.h', 'nblapi.h', 'miniportgeneralattributes.h', 'netioapi.h')) {
            $p = Join-Path $h $f
            if (Test-Path $p) { Copy-Item $p "$env:GITHUB_WORKSPACE\wdk-src\" -Force }
          }
          foreach ($f in @('ntddndis.h', 'ndis.h')) {
            $p = Join-Path "$env:WDKINC\shared" $f
            if (Test-Path $p) { Copy-Item $p "$env:GITHUB_WORKSPACE\wdk-src\" -Force }
          }
          # The NDIS_OID_REQUEST struct body is not in ntddndis.h either (only a forward declaration);
          # it is in ndis/oidrequest.h -- ndis.h:4441 includes it. The protocol side must send
          # OID_GEN_CURRENT_PACKET_FILTER, so it has to get this struct first.
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\wdk-src\ndis" | Out-Null
          foreach ($f in @('oidrequest.h', 'types.h', 'status.h')) {
            $p = Join-Path "$env:WDKINC\shared\ndis" $f
            if (Test-Path $p) { Copy-Item $p "$env:GITHUB_WORKSPACE\wdk-src\ndis\" -Force }
          }
          # Last round that recursive lookup printed nothing: in PowerShell a bare { ... } is just a script-block
          # literal, discarded after evaluation and never executed -- it must be written as & { ... }.
          # This round does not guess directories: ndis.h is under km\, and it #includes <ndis/xxx.h>,
          # so <ndis/oidrequest.h> must resolve to km\ndis\. Copy the whole directory back.
          "`n=== km\ndis directory ===" | Tee-Object -FilePath $log -Append
          $ndis_sub = Join-Path $h 'ndis'
          if (Test-Path $ndis_sub) {
            Get-ChildItem $ndis_sub -Filter '*.h' -ErrorAction SilentlyContinue | ForEach-Object {
              "$($_.Name) = $($_.Length) B" | Tee-Object -FilePath $log -Append
              Copy-Item $_.FullName "$env:GITHUB_WORKSPACE\wdk-src\ndis\" -Force
            }
          } else { 'km\ndis does not exist' | Tee-Object -FilePath $log -Append }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\wdk-src\ndis\oidrequest.h")) {
            'oidrequest.h still not acquired' | Tee-Object -FilePath $log -Append
          }
          Copy-Item "$env:WDKINC\shared\ndis\version.h" "$env:GITHUB_WORKSPACE\wdk-src\ndis-version.h" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:GITHUB_WORKSPACE\wdk-src" -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Out-String | Tee-Object -FilePath $log -Append

      # Round 3: two compile-time questions can only be answered by the compiler.
      #   * iwanmp is both a miniport and a protocol driver; which version macros should the project define?
      #     In ndis.h, NDIS_MINIPORT_DRIVER hit "reserved", but that block is guarded by
      #     #ifdef NETCX_ADAPTER_2; not compiling is just guessing.
      #   * Is there still a route lookup API in kernel mode (the GetBestRoute2 family)? This decides
      #     whether the driver looks up the next hop itself or the control plane computes it at session setup.
      - name: Verify iwanmp NDIS version macros and route API availability
        continue-on-error: true
        shell: pwsh
        run: |
          $msvc = Get-ChildItem "$env:VSDIR\VC\Tools\MSVC" -Directory |
                  Sort-Object Name | Select-Object -Last 1
          $cl = Get-ChildItem $msvc.FullName -Recurse -Filter cl.exe |
                Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $incs = @("$env:WDKINC\km", "$env:WDKINC\km\crt", "$env:WDKINC\shared",
                    "$env:WDKINC\ucrt", "$($msvc.FullName)\include") |
                  Where-Object { Test-Path $_ } | ForEach-Object { "/I$_" }
          $log = "$env:GITHUB_WORKSPACE\mp-macro.log"

          # Print only macro resolution results; not linked
          @'
          #include <ndis.h>
          #define IWAN_S(x) #x
          #define IWAN_T(x) IWAN_S(x)
          #pragma message("IWANMP miniport_ver=" IWAN_T(NDIS_MINIPORT_MAJOR_VERSION) "." IWAN_T(NDIS_MINIPORT_MINOR_VERSION))
          #pragma message("IWANMP protocol_ver=" IWAN_T(NDIS_PROTOCOL_MAJOR_VERSION) "." IWAN_T(NDIS_PROTOCOL_MINOR_VERSION))
          #pragma message("IWANMP legacy_miniport=" IWAN_T(NDIS_LEGACY_MINIPORT) " legacy_protocol=" IWAN_T(NDIS_LEGACY_PROTOCOL))
          #pragma message("IWANMP support630=" IWAN_T(NDIS_SUPPORT_NDIS630) " support683=" IWAN_T(NDIS_SUPPORT_NDIS683))
          #pragma message("IWANMP ndis_wdm=" IWAN_T(NDIS_WDM) " miniport_driver=" IWAN_T(NDIS_MINIPORT_DRIVER))
          int iwan_mp_probe_anchor(void);
          int iwan_mp_probe_anchor(void) { return 0; }
          '@ | Set-Content -Encoding ascii win-driver\mp_probe.c

          # Can kernel mode look up routes: compile a real call; the error is the answer
          @'
          #include <ndis.h>
          #include <netioapi.h>
          NTSTATUS iwan_mp_probe_route(void)
          {
              MIB_IPFORWARD_ROW2 row;
              SOCKADDR_INET src, dst;
              NET_LUID luid;
              NET_IFINDEX idx;

              RtlZeroMemory(&row, sizeof(row));
              RtlZeroMemory(&src, sizeof(src));
              RtlZeroMemory(&dst, sizeof(dst));
              RtlZeroMemory(&luid, sizeof(luid));
              idx = ConvertInterfaceLuidToIndex(&luid);
              ConvertInterfaceIndexToLuid(idx, &luid);
              return GetBestRoute2(NULL, idx, NULL, &dst, 0, &row, &src);
          }
          '@ | Set-Content -Encoding ascii win-driver\mp_probe_netio.c

          $sets = @(
            @{ n = 'A: NDIS630 + NDIS630_MINIPORT'; d = @('/DNDIS630', '/DNDIS630_MINIPORT', '/DNDIS_WDM') },
            @{ n = 'B: NDIS_MINIPORT_DRIVER + 620/683_MINIPORT'; d = @('/DNDIS_MINIPORT_DRIVER', '/DNDIS620_MINIPORT', '/DNDIS683_MINIPORT', '/DNDIS_WDM') },
            @{ n = 'C: NDIS630 only'; d = @('/DNDIS630') }
          )
          foreach ($s in $sets) {
            "`n=== macro resolution $($s.n) ===" | Tee-Object -FilePath $log -Append
            $cargs = @('/nologo', '/kernel', '/c', '/Zs', '/std:c11', '/W4', '/WX-',
                       '/Iwin-driver', '/Isrc\common') + $incs + $s.d +
                     @('/D_AMD64_', 'win-driver\mp_probe.c')
            & $cl.FullName @cargs 2>&1 | Tee-Object -FilePath $log -Append
          }
          "`n=== kernel-mode route API (netioapi.h) ===" | Tee-Object -FilePath $log -Append
          $rargs = @('/nologo', '/kernel', '/c', '/Zs', '/std:c11', '/W4', '/WX-',
                     '/Iwin-driver', '/Isrc\common') + $incs +
                   @('/DNDIS630', '/DNDIS630_MINIPORT', '/DNDIS_WDM', '/D_AMD64_',
                     'win-driver\mp_probe_netio.c')
          & $cl.FullName @rargs 2>&1 | Tee-Object -FilePath $log -Append

          $root = Split-Path $env:WDKINC -Parent
          function P3($title, $pattern, $ctx, $max) {
            "`n=== $title ===" | Tee-Object -FilePath $log -Append
            Get-ChildItem $root -Recurse -Filter '*.h' -ErrorAction SilentlyContinue |
              Select-String -Pattern $pattern -ErrorAction SilentlyContinue |
              Select-Object -First $max | ForEach-Object {
                "$($_.Filename):$($_.LineNumber): $($_.Line)"
                if ($ctx -gt 0) { Get-Content $_.Path | Select-Object -Skip $_.LineNumber -First $ctx }
              } | Out-String -Width 240 | Tee-Object -FilePath $log -Append
          }
          P3 'PROTOCOL_RECEIVE_NET_BUFFER_LISTS prototype' 'PROTOCOL_RECEIVE_NET_BUFFER_LISTS\)' 10 1
          P3 'PROTOCOL_BIND_ADAPTER_EX prototype' 'PROTOCOL_BIND_ADAPTER_EX\)' 10 1
          P3 'PROTOCOL_SEND_NET_BUFFER_LISTS_COMPLETE prototype' 'PROTOCOL_SEND_NET_BUFFER_LISTS_COMPLETE\)' 8 1
          P3 'NDIS_STATISTICS_INFO struct' '_NDIS_STATISTICS_INFO$' 30 1
          P3 'NDIS_LINK_STATE struct' '_NDIS_LINK_STATE$' 18 1
          P3 'object type GUID: registration attributes' 'NDIS_OBJECT_TYPE_MINIPORT_ADAPTER_REGISTRATION_ATTRIBUTES' 2 3
          P3 'object type GUID: general attributes' 'NDIS_OBJECT_TYPE_MINIPORT_ADAPTER_GENERAL_ATTRIBUTES' 2 3
          P3 'object type GUID: miniport driver characteristics' 'NDIS_OBJECT_TYPE_MINIPORT_DRIVER_CHARACTERISTICS' 2 3
          P3 'object type GUID: protocol driver characteristics' 'NDIS_OBJECT_TYPE_PROTOCOL_DRIVER_CHARACTERISTICS' 2 3
          P3 'object type GUID: NBL pool parameters' 'NDIS_OBJECT_TYPE_NET_BUFFER_LIST_POOL_PARAMETERS' 2 3
          P3 'supported statistics bits' 'NDIS_STATISTICS_XMIT_OK_SUPPORTED' 2 3
          P3 'MacOptions bits' 'define NDIS_MAC_OPTION_' 2 12
          P3 'NdisMediumIP and physical medium' 'NdisMediumIP$|NdisPhysicalMediumUnspecified' 2 4
          P3 'IF_TYPE_PROP_VIRTUAL' 'define IF_TYPE_PROP_VIRTUAL' 2 2
          P3 'EtherType constants' 'define ETHERTYPE_IP$|define ETHERTYPE_ARP$|define ETHERTYPE_IPV6$' 2 4
          P3 'ExInitializeDriverRuntime' 'ExInitializeDriverRuntime\(' 8 1
          P3 'NdisGetVersion prototype' 'NdisGetVersion\(' 6 1
          P3 'NdisAllocateNetBufferListPool/NdisFreeNetBufferList' 'NdisAllocateNetBufferListPool\(|NdisFreeNetBufferList\(' 8 2
          P3 'NDIS_DEFAULT_PORT_NUMBER' 'define NDIS_DEFAULT_PORT_NUMBER' 2 2

      # Compile only first: /t:ClCompile does not link or verify INF, so even if the next two steps fail
      # we get full C-side diagnostics (last round InfVerif blocked us before compiling and wasted a run).
      - name: msbuild compile only (no link)
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:MSBUILD 'win-driver\iwan.vcxproj' /nologo /v:normal /t:ClCompile `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
              "/p:OutDir=$env:GITHUB_WORKSPACE\build\x64\Release\" 2>&1 |
              Tee-Object -FilePath cl-build.log
          "ClCompile exit code=$LASTEXITCODE"

      - name: msbuild driver
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:MSBUILD 'win-driver\iwan.vcxproj' /nologo /v:normal `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
              "/p:OutDir=$env:GITHUB_WORKSPACE\build\x64\Release\" 2>&1 |
              Tee-Object -FilePath msbuild.log
          "msbuild exit code=$LASTEXITCODE"

      # NDIS plane (miniport + protocol driver). Independent of iwan.sys: one failure does not affect
      # the other output; the criterion is still whether each .sys exists.
      - name: msbuild iwanmp (NDIS plane)
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:MSBUILD 'win-driver\iwanmp.vcxproj' /nologo /v:normal `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
              "/p:OutDir=$env:GITHUB_WORKSPACE\build\x64\Release\" 2>&1 |
              Tee-Object -FilePath msbuild-mp.log
          "msbuild-mp exit code=$LASTEXITCODE"

      # Count NIC (the iwancnt.sys project). Fully independent of the other two planes.
      - name: msbuild iwancnt (count NIC)
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:MSBUILD 'win-driver\iwancnt.vcxproj' /nologo /v:normal `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
              "/p:OutDir=$env:GITHUB_WORKSPACE\build\x64\Release\" 2>&1 |
              Tee-Object -FilePath msbuild-cnt.log
          "msbuild-cnt exit code=$LASTEXITCODE"

      - name: Fetch x64 devcon.exe (to create the host NIC in the VM)
        if: always()
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $dev = Get-ChildItem "$sdk\Tools" -Recurse -Filter devcon.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          if ($dev) {
            Copy-Item $dev.FullName "$env:GITHUB_WORKSPACE\out\devcon.exe"
            "obtained $($dev.FullName)"
          } else {
            "x64 devcon.exe not found on the runner"
          }

      # The steps above are continue-on-error, so "workflow success" never means "build success":
      # one run reported success with a C2220 and no iwan.sys in the artifacts. The criterion is the product.
      - name: Assert the three .sys files were actually produced
        if: always()
        shell: pwsh
        run: |
          $bad = 0
          foreach ($n in @('iwan.sys', 'iwanmp.sys', 'iwancnt.sys')) {
            $sys = "$env:GITHUB_WORKSPACE\build\x64\Release\$n"
            if (Test-Path $sys) {
              "$n exists: $((Get-Item $sys).Length) bytes"
            } else {
              "build produced no $n -- this run is judged failed"
              $bad = 1
            }
          }
          if ($bad -ne 0) { exit 1 }

      # MSVC static analysis (PREfast /analyze). Deliberately run cl.exe directly instead of an msbuild
      # property: a misspelled property is silently ignored, and /analyze:log only writes XML if analysis
      # really ran, so "does the XML exist" is itself the positive control (do not just look for warnings).
      - name: cl static analysis (/analyze)
        continue-on-error: true
        shell: pwsh
        run: |
          $msvc = Get-ChildItem "$env:VSDIR\VC\Tools\MSVC" -Directory |
                  Sort-Object Name | Select-Object -Last 1
          $cl = Get-ChildItem $msvc.FullName -Recurse -Filter cl.exe |
                Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          "CL=$($cl.FullName)"
          # Mark WDK and STL headers as external: /external:I /external:W0 do only this (see $common
          # below). Note the two /Zs syntax checks still use /I (they only need the same headers to
          # be found; internal/external distinction does not matter there).
          $incs = @("$env:WDKINC\km", "$env:WDKINC\km\crt", "$env:WDKINC\shared",
                    "$env:WDKINC\ucrt", "$($msvc.FullName)\include") |
                  Where-Object { Test-Path $_ } | ForEach-Object { "/external:I$_" }
          New-Item -ItemType Directory -Force -Path analyze-obj | Out-Null
          # /external:W0 stops the WDK/STL headers marked external above from contributing warnings:
          # measured 700+ all come from the headers themselves (C4324 struct alignment padding, C28160
          # must-succeed pool allocation annotation self-check, C6387 ExAllocatePoolZero may return 0,
          # C28301 POOL_FLAGS first declaration has no annotation, C28252/C28253 MmGetSystemRoutineAddress
          # annotation mismatch, C28230/C28285 ntddk.h WHEA annotation expressions reference nonexistent
          # members, C6553 annotation on a value type). In the real build these headers are suppressed by
          # /FI shared\warning.h; the hand-written analysis command line lacks that step, so they must be
          # marked external explicitly, otherwise our own defects drown in noise.
          # The real build (iwan.vcxproj) suppresses WDK header warnings with /FI shared\warning.h;
          # copy that step here so the "analysis baseline" and "build baseline" do not diverge.
          $wdkhdr = @()
          if (Test-Path "$env:WDKINC\shared\warning.h") {
            $wdkhdr = @("/FI$env:WDKINC\shared\warning.h")
          } else {
            "WDK warning.h not present, skipping /FI"
          }
          $common = @('/nologo', '/kernel', '/c', '/std:c11', '/W4', '/WX-',
                      '/analyze', '/external:W0',
                      "/Fo$env:GITHUB_WORKSPACE\analyze-obj\",
                      '/Iwin-driver', '/Isrc\common') + $incs + $wdkhdr + @('/D_AMD64_')
          $sets = @(
            @{ log = 'analysis-wfp.xml'; defs = @('/DNDIS630');
               src = @('win-driver\iwan_win_drv.c', 'win-driver\iwan_win_session.c',
                       'win-driver\iwan_win_wfp.c', 'win-driver\iwan_win_frame.c') },
            @{ log = 'analysis-mp.xml'; defs = @('/DNDIS630', '/DNDIS_WDM', '/DIWAN_WIN_PLANE_MP');
               src = @('win-driver\iwan_win_proto.c', 'win-driver\iwan_win_mpdata.c',
                       'win-driver\iwan_win_drv.c', 'win-driver\iwan_win_session.c',
                       'win-driver\iwan_win_frame.c') },
            @{ log = 'analysis-mp-miniport.xml';
               defs = @('/DNDIS_MINIPORT_DRIVER', '/DNDIS620_MINIPORT', '/DNDIS683_MINIPORT',
                        '/DNDIS_WDM', '/DIWAN_WIN_PLANE_MP');
               src = @('win-driver\iwan_win_mp.c') },
            @{ log = 'analysis-cnt.xml';
               defs = @('/DNDIS_MINIPORT_DRIVER', '/DNDIS620_MINIPORT', '/DNDIS683_MINIPORT',
                        '/DNDIS_WDM');
               src = @('win-driver\iwan_cnt.c') })
          foreach ($s in $sets) {
            $a = $common + $s.defs + @("/analyze:log", $s.log) + $s.src
            & $cl.FullName @a 2>&1 | Tee-Object -FilePath ($s.log -replace '\.xml$', '.log')
            "analyze $($s.log) exit code=$LASTEXITCODE"
          }

      # Positive control: if the XML is missing, /analyze never ran (or failed early), and "0 warnings"
      # means nothing. This step deliberately does not continue-on-error so it shows in the workflow verdict.
      - name: Print NDIS miniport general attributes struct (experiment)
        # The ndis.h snapshot available to this repo is truncated at line 15076 and exactly misses this struct;
        # the MAC array field names differ per version and a wrong name is C2039. Use it to replace the
        # temporary offset-based MAC lookup in mp.c.
        if: always()
        shell: pwsh
        run: |
          $h = Join-Path $env:WDKINC 'km\ndis.h'
          if (-not (Test-Path $h)) { "missing $h"; exit 0 }
          $m = Select-String -Path $h -Pattern 'typedef\s+struct\s+_NDIS_MINIPORT_ADAPTER_GENERAL_ATTRIBUTES' |
               Select-Object -First 1
          if (-not $m) { 'struct definition not found'; exit 0 }
          Get-Content $h | Select-Object -Skip ($m.LineNumber - 1) -First 60

      - name: Assert static analysis really ran
        if: always()
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @('analysis-wfp.xml', 'analysis-mp.xml', 'analysis-mp-miniport.xml', 'analysis-cnt.xml')) {
            if (Test-Path $f) {
              "$f exists: $((Get-Item $f).Length) bytes"
            } else {
              "$f missing -- static analysis did not run, this result is not trustworthy"
              $bad = 1
            }
          }
          if ($bad -ne 0) { exit 1 }

      # Turn "our own source zero defects" from a slogan into a gate: in the XML, any FILEPATH under
      # Windows Kits is a WDK header annotation self-check (C28160 must-succeed pool allocation, C6387
      # allocator may return 0, C28301 POOL_FLAGS first declaration has no annotation, C28252/C28253
      # MmGetSystemRoutineAddress IRQL annotations inconsistent, C28230/C28285 WHEA annotations reference
      # nonexistent members, C6553 annotation on a value type) -- those are Microsoft headers; we can
      # neither change them nor should we; what we guarantee is that none come from win-driver/.
      # /external:W0 suppresses compiler-level warnings (C4324 is zero) but not analysis annotations, so the gate uses source file.
      - name: Assert our own source has zero defects
        if: always()
        shell: pwsh
        run: |
          $hdrCodes = @{}
          $ours = @()
          foreach ($f in @('analysis-wfp.xml', 'analysis-mp.xml', 'analysis-mp-miniport.xml', 'analysis-cnt.xml')) {
            if (-not (Test-Path $f)) { "skipping missing $f"; continue }
            [xml]$x = Get-Content -Raw $f
            foreach ($d in $x.SelectNodes('/DEFECTS/DEFECT')) {
              $file = $d.SelectSingleNode('SFA/FILEPATH').InnerText
              $name = $d.SelectSingleNode('SFA/FILENAME').InnerText
              $line = $d.SelectSingleNode('SFA/LINE').InnerText
              $code = $d.SelectSingleNode('DEFECTCODE').InnerText.Trim()
              if ($file -match 'Windows Kits') {
                $k = "$code $name`:$line"
                if (-not $hdrCodes.ContainsKey($k)) { $hdrCodes[$k] = 0 }
                $hdrCodes[$k] = $hdrCodes[$k] + 1
              } else {
                $ours += "$file$name`:$line C$code $($d.SelectSingleNode('DESCRIPTION').InnerText.Trim())"
              }
            }
          }
          "WDK header annotation self-checks (not our code; recorded only):"
          if ($hdrCodes.Count -eq 0) { "  none" }
          foreach ($k in ($hdrCodes.Keys | Sort-Object)) {
            "  {0,-30} x{1}" -f $k, $hdrCodes[$k]
          }
          if ($ours.Count -gt 0) {
            "our own source has $($ours.Count) defects:"
            $ours | ForEach-Object { "  $_" }
            exit 1
          }
          "our own source: 0 defects"

      - name: Upload artifacts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-driver-x64
          path: |
            build/x64/Release/iwan.sys
            build/x64/Release/iwan.pdb
            build/x64/Release/iwanmp.sys
            build/x64/Release/iwanmp.pdb
            win-driver/iwanmp.inf
            build/x64/Release/iwancnt.sys
            build/x64/Release/iwancnt.pdb
            win-driver/iwancnt.inf
            wdk-src/**
            out/devcon.exe
            analysis-*.xml
            **/*.log
          if-no-files-found: warn
