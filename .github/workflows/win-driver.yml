# Windows 内核驱动（WFP callout 数据面）的编译流水线。
#
# 为什么单独一个 workflow：开发机（Linux）与测试机（nano11 虚拟机）都没有
# WDK/MSVC，编译器只能借 GitHub 的 windows runner（镜像自带 VS + WDK）。
# 本机只做可测层对拍（tests/win_frame_test.c），虚拟机只做签名/加载/联调。
#
# 触发：只碰 win-driver/**、共享 ABI 头或本文件时跑；也支持手动触发，
# 方便改完驱动后用 `gh workflow run win-driver.yml --ref <branch>` 单独重跑，
# 不必连带触发 build.yml 的全平台矩阵。
name: win-driver

on:
  workflow_dispatch:
  push:
    paths:
      - 'win-driver/**'
      - 'src/common/iwan_win_abi.h'
      - '.github/workflows/win-driver.yml'

permissions:
  contents: read

jobs:
  wdk:
    runs-on: windows-2022
    concurrency:
      group: win-driver-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: 探测工具链（VS / WDK / 头 / 库）
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE\env.log"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          # 64 位 MSBuild：32 位那套会去加载 x86\InfVerif.dll（WDK 只装了 x64 的），
          # INF 校验步骤直接抛 "Unable to load DLL 'x86\InfVerif.dll'"。
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
                     -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) {
            $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
                       -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          }
          "VSDIR=$vs"       | Tee-Object -FilePath $log -Append
          "MSBUILD=$msbuild" | Tee-Object -FilePath $log -Append
          "VSDIR=$vs"        >> $env:GITHUB_ENV
          "MSBUILD=$msbuild" >> $env:GITHUB_ENV

          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          # 注意：$sdk\Include 下除版本目录外还有 wdf；按名字排序会把 wdf 排到最后，
          # 于是 ntddk.h/fwpsk.h 全都找不到 —— 必须只认 10.* 并按版本号排序。
          $inc = Get-ChildItem "$sdk\Include" -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -match '^10\.' } |
                 Sort-Object { [version]$_.Name } | Select-Object -Last 1
          "WDKINC=$($inc.FullName)" | Tee-Object -FilePath $log -Append
          "WDKINC=$($inc.FullName)" >> $env:GITHUB_ENV

          $probe = @(
            @{ n = 'sdk include 版本'; v = (Get-ChildItem "$sdk\Include" -Directory -ErrorAction SilentlyContinue | Select-Object -Expand Name) -join ',' },
            @{ n = 'km\fwpsk.h';       v = (Test-Path "$($inc.FullName)\km\fwpsk.h") },
            @{ n = 'km\ndis.h';        v = (Test-Path "$($inc.FullName)\km\ndis.h") },
            @{ n = 'km\wdmsec.h';      v = (Test-Path "$($inc.FullName)\km\wdmsec.h") },
            @{ n = 'km\stdint.h';      v = (Test-Path "$($inc.FullName)\km\stdint.h") },
            @{ n = 'km\crt\stdint.h';  v = (Test-Path "$($inc.FullName)\km\crt\stdint.h") },
            @{ n = 'fwpkclnt.lib';     v = (Get-ChildItem "$sdk\Lib" -Recurse -Filter fwpkclnt.lib -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' },
            @{ n = 'ndis.lib';         v = (Get-ChildItem "$sdk\Lib" -Recurse -Filter ndis.lib -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' },
            @{ n = 'wdmsec.lib';       v = (Get-ChildItem "$sdk\Lib" -Recurse -Filter wdmsec.lib -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' },
            @{ n = 'devcon.exe';       v = (Get-ChildItem "$sdk\Tools" -Recurse -Filter devcon.exe -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' },
            @{ n = '驱动工具集 props';  v = (Get-ChildItem "$vs\MSBuild" -Recurse -Filter 'WindowsKernelModeDriver*.props' -ErrorAction SilentlyContinue | Select-Object -First 2 -Expand FullName) -join ';' }
          )
          foreach ($p in $probe) { "$($p.n) = $($p.v)" | Tee-Object -FilePath $log -Append }

      # cl 语法检查先行：/Zs 只解析不产 object、不链接，因此不依赖驱动工具集
      # 是否装好。它能在 msbuild 之前把所有编译错误一次性打全，省去来回。
      - name: cl 语法检查（不拦，只为拿全量报错）
        continue-on-error: true
        shell: pwsh
        run: |
          $msvc = Get-ChildItem "$env:VSDIR\VC\Tools\MSVC" -Directory |
                  Sort-Object Name | Select-Object -Last 1
          $cl = Get-ChildItem $msvc.FullName -Recurse -Filter cl.exe |
                Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          "CL=$($cl.FullName)"
          $incs = @("$env:WDKINC\km", "$env:WDKINC\km\crt", "$env:WDKINC\shared",
                    "$env:WDKINC\ucrt", "$($msvc.FullName)\include") |
                  Where-Object { Test-Path $_ } | ForEach-Object { "/I$_" }
          $common = @('/nologo', '/kernel', '/c', '/Zs', '/std:c11', '/W4', '/WX-',
                      '/Iwin-driver', '/Isrc\common') + $incs + @('/D_AMD64_')
          # WFP 平面（iwan.sys）
          $clArgs = $common + @('/DNDIS630') +
                  @('win-driver\iwan_win_drv.c', 'win-driver\iwan_win_session.c',
                    'win-driver\iwan_win_wfp.c', 'win-driver\iwan_win_frame.c')
          & $cl.FullName @clArgs 2>&1 | Tee-Object -FilePath cl-syntax.log
          "cl 退出码=$LASTEXITCODE"
          # NDIS 平面（iwanmp.sys）。ndis.h 的小型端口宏与协议宏不能同时要，
          # 所以 iwan_win_mp.c 单独跑一遍，其余源文件走协议/通用宏。
          $mpArgs = $common + @('/DNDIS630', '/DNDIS_WDM', '/DIWAN_WIN_PLANE_MP') +
                  @('win-driver\iwan_win_proto.c', 'win-driver\iwan_win_mpdata.c',
                    'win-driver\iwan_win_drv.c', 'win-driver\iwan_win_session.c',
                    'win-driver\iwan_win_frame.c')
          & $cl.FullName @mpArgs 2>&1 | Tee-Object -FilePath cl-mp.log
          "cl mp 退出码=$LASTEXITCODE"
          $mpoArgs = $common + @('/DNDIS_MINIPORT_DRIVER', '/DNDIS620_MINIPORT',
                                 '/DNDIS683_MINIPORT',
                                 '/DNDIS_WDM', '/DIWAN_WIN_PLANE_MP') +
                  @('win-driver\iwan_win_mp.c')
          & $cl.FullName @mpoArgs 2>&1 | Tee-Object -FilePath cl-mp-miniport.log
          "cl mp-miniport 退出码=$LASTEXITCODE"

      # 把我不确定的 API 原型/结构成员直接从 WDK 头里打出来：猜签名是上一次
      # 反复出错的原因（FwpsInjectNetworkReceiveAsync0 我上一次"修"错了方向）。
      - name: 查 WDK 头里的原型与结构成员
        continue-on-error: true
        shell: pwsh
        run: |
          $h = "$env:WDKINC\km"
          $log = "$env:GITHUB_WORKSPACE\api-probe.log"
          function P($title, $file, $pattern, $after) {
            "`n=== $title ===" | Tee-Object -FilePath $log -Append
            if (Test-Path $file) {
              Select-String -Path $file -Pattern $pattern -Context 0, $after |
                Select-Object -First 3 | Out-String -Width 240 |
                Tee-Object -FilePath $log -Append
            } else { "缺文件 $file" | Tee-Object -FilePath $log -Append }
          }
          P 'FWPS_INJECT_COMPLETE0 定义' "$h\fwpsk.h" 'typedef.*FWPS_INJECT_COMPLETE0' 3
          P 'FwpsInjectNetworkReceiveAsync0 原型' "$h\fwpsk.h" 'FwpsInjectNetworkReceiveAsync0' 12
          P 'FWPS_INCOMING_METADATA_VALUES0 的索引/接口成员' "$h\fwpsk.h" 'incomingInterfaceIndex|interfaceIndex|subInterfaceIndex' 1
          P 'FWPM_FILTER0 的上下文成员' "$h\fwpmk.h" 'rawContext|providerContextKey' 2
          P 'NdisAllocateNetBufferListPool 原型' "$h\ndis.h" 'NdisAllocateNetBufferListPool\(' 6
          P 'NET_BUFFER_LIST_POOL_PARAMETERS 定义' "$h\ndis\nbl.h" 'typedef struct _NET_BUFFER_LIST_POOL_PARAMETERS' 12
          "`n=== 哪个头声明 KeStackAttachProcess ===" | Tee-Object -FilePath $log -Append
          Get-ChildItem $h -Filter '*.h' | ForEach-Object {
            if (Select-String -Path $_.FullName -Pattern 'KeStackAttachProcess' -Quiet) { $_.Name }
          } | Tee-Object -FilePath $log -Append

      # 写 NDIS 微型端口 + 协议驱动前，把契约从 WDK 头里逐条打出来。上一轮的教训
      # 是"猜签名"：FwpsInjectNetworkReceiveAsync0 我按猜的方向"修"过一轮，白等一次
      # CI。这里一次把需要的原型/结构/宏全取回来。
      - name: 查 WDK 里的 NDIS 微型端口与协议驱动契约
        continue-on-error: true
        shell: pwsh
        run: |
          $h = "$env:WDKINC\km"
          $log = "$env:GITHUB_WORKSPACE\ndis-probe.log"
          function PA($title, $pattern, $ctx, $max) {
            "`n=== $title ===" | Tee-Object -FilePath $log -Append
            Get-ChildItem $h -Recurse -Filter '*.h' -ErrorAction SilentlyContinue |
              Select-String -Pattern $pattern -ErrorAction SilentlyContinue |
              Select-Object -First $max | ForEach-Object {
                "$($_.Filename):$($_.LineNumber): $($_.Line)"
                if ($ctx -gt 0) {
                  Get-Content $_.Path | Select-Object -Skip $_.LineNumber -First $ctx
                }
              } | Out-String -Width 240 | Tee-Object -FilePath $log -Append
          }
          PA 'NdisRegisterProtocolDriver 原型' 'NdisRegisterProtocolDriver\(' 8 1
          PA 'NDIS_PROTOCOL_DRIVER_CHARACTERISTICS 结构' 'typedef struct _NDIS_PROTOCOL_DRIVER_CHARACTERISTICS' 52 1
          PA 'PROTOCOL_DRIVER_CHARACTERISTICS 的 Revision/Size 宏' 'NDIS_SIZEOF_PROTOCOL_DRIVER_CHARACTERISTICS_REVISION' 1 6
          PA 'NdisSendNetBufferLists 原型' 'NdisSendNetBufferLists\(' 8 1
          PA 'NdisOpenAdapterEx 原型' 'NdisOpenAdapterEx\(' 10 1
          PA 'NDIS_MINIPORT_DRIVER_CHARACTERISTICS 结构' 'typedef struct _NDIS_MINIPORT_DRIVER_CHARACTERISTICS' 52 1
          PA 'MINIPORT_DRIVER_CHARACTERISTICS 的 Revision/Size 宏' 'NDIS_SIZEOF_MINIPORT_DRIVER_CHARACTERISTICS_REVISION' 1 6
          PA 'NdisMRegisterMiniportDriver 原型' 'NdisMRegisterMiniportDriver\(' 8 1
          PA 'NdisMDeregisterMiniportDriver 原型' 'NdisMDeregisterMiniportDriver\(' 4 1
          PA 'NdisMIndicateReceiveNetBufferLists 原型' 'NdisMIndicateReceiveNetBufferLists\(' 10 1
          PA 'NdisMSendNetBufferListsComplete 原型' 'NdisMSendNetBufferListsComplete\(' 6 1
          PA 'NDIS_MINIPORT_ADAPTER_GENERAL_ATTRIBUTES 结构' 'typedef struct _NDIS_MINIPORT_ADAPTER_GENERAL_ATTRIBUTES' 45 1
          PA 'NDIS_MINIPORT_ADAPTER_REGISTRATION_ATTRIBUTES 结构' 'typedef struct _NDIS_MINIPORT_ADAPTER_REGISTRATION_ATTRIBUTES' 16 1
          PA 'NdisMSetMiniportAttributes 原型' 'NdisMSetMiniportAttributes\(' 6 1
          PA 'NET_BUFFER_LIST_POOL_PARAMETERS 结构' 'typedef struct _NET_BUFFER_LIST_POOL_PARAMETERS' 18 1
          PA 'ProtocolReceiveNetBufferLists 原型' 'ProtocolReceiveNetBufferLists\(' 12 1
          PA 'ProtocolSendNetBufferListsComplete 原型' 'ProtocolSendNetBufferListsComplete\(' 12 1
          PA 'NdisReturnNetBufferLists 原型' 'NdisReturnNetBufferLists\(' 6 1
          PA 'NdisAllocateNetBuffer 原型' 'NdisAllocateNetBuffer\(' 6 1
          PA 'NdisAllocateNetBufferList 原型' 'NdisAllocateNetBufferList\(' 6 1
          PA 'NET_BUFFER_FIRST_MDL 宏' 'define NET_BUFFER_FIRST_MDL' 1 1
          PA 'NDIS_RECEIVE_FLAGS 常量' 'define NDIS_RECEIVE_FLAGS_' 1 6
          PA 'NDIS_INTERFACE_INFORMATION 结构' 'typedef struct _NDIS_INTERFACE_INFORMATION' 30 1
          PA 'OID_GEN_INTERFACE_INFO 定义' 'define OID_GEN_INTERFACE_INFO' 1 1
          PA 'OID_GEN_MAXIMUM_FRAME_SIZE/TOTAL_SIZE 定义' 'define OID_GEN_MAXIMUM_(FRAME_SIZE|TOTAL_SIZE)' 1 2
          PA 'GetBestRoute2 声明' 'GetBestRoute2' 8 1
          PA 'MIB_IPFORWARD_ROW2 结构' 'typedef struct _MIB_IPFORWARD_ROW2' 26 1
          PA 'ConvertInterfaceIndexToLuid 声明' 'ConvertInterfaceIndexToLuid\(' 6 1
          PA 'ConvertInterfaceLuidToIndex 声明' 'ConvertInterfaceLuidToIndex\(' 6 1
          PA 'NdisIfGetNetLuid 系列' 'NdisIfGetNetLuid' 4 2
          PA 'NdisMNetPnPEvent 原型' 'NdisMNetPnPEvent\(' 6 1
          PA 'ndis.h 里对 NDIS_*_DRIVER 宏的条件使用' '#if.*NDIS_(MINIPORT|PROTOCOL|FILTER)_DRIVER' 2 6
          PA 'NDIS_WDM 宏的使用' 'defined\(NDIS_WDM\)' 2 3

          # 第二轮：宏闸门、handler 原型、OID 与路由头（第一轮在 km 下没找到的，
          # 这一轮搜整个 Include 树）。ndis.h 里 NDIS_MINIPORT_DRIVER 撞上了一行
          # "#error ... macro is reserved"，必须看清它是被什么条件包住的，
          # 否则工程该定义哪几个宏就是瞎猜。
          $root = Split-Path $env:WDKINC -Parent
          function P2($title, $pattern, $ctx, $max) {
            "`n=== $title ===" | Tee-Object -FilePath $log -Append
            Get-ChildItem $root -Recurse -Filter '*.h' -ErrorAction SilentlyContinue |
              Select-String -Pattern $pattern -ErrorAction SilentlyContinue |
              Select-Object -First $max | ForEach-Object {
                "$($_.Path):$($_.LineNumber): $($_.Line)"
                if ($ctx -gt 0) {
                  Get-Content $_.Path | Select-Object -Skip $_.LineNumber -First $ctx
                }
              } | Out-String -Width 240 | Tee-Object -FilePath $log -Append
          }
          function R2($title, $file, $start, $count) {
            "`n=== $title ($file : $start +$count) ===" | Tee-Object -FilePath $log -Append
            $p = Join-Path $h $file
            if (Test-Path $p) {
              Get-Content $p | Select-Object -Skip ($start - 1) -First $count |
                Out-String -Width 200 | Tee-Object -FilePath $log -Append
            } else { "no such file $p" | Tee-Object -FilePath $log -Append }
          }
          R2 'ndis.h 宏闸门（版本宏与保留宏）' 'ndis.h' 150 210
          R2 'ndis.h 协议版本宏推断' 'ndis.h' 750 60
          R2 'ndis.h 微型端口版本宏推断' 'ndis.h' 900 70
          P2 'RECEIVE_NET_BUFFER_LISTS_HANDLER 原型' 'RECEIVE_NET_BUFFER_LISTS_HANDLER\)' 14 1
          P2 'SEND_NET_BUFFER_LISTS_COMPLETE_HANDLER 原型' 'SEND_NET_BUFFER_LISTS_COMPLETE_HANDLER\)' 12 1
          P2 'BIND_HANDLER_EX 原型' 'BIND_HANDLER_EX\)' 14 1
          P2 'UNBIND_HANDLER_EX 原型' 'UNBIND_HANDLER_EX\)' 10 1
          P2 'OPEN_ADAPTER_COMPLETE_HANDLER_EX 原型' 'OPEN_ADAPTER_COMPLETE_HANDLER_EX\)' 10 1
          P2 'CLOSE_ADAPTER_COMPLETE_HANDLER_EX 原型' 'CLOSE_ADAPTER_COMPLETE_HANDLER_EX\)' 10 1
          P2 'NDIS_BIND_PARAMETERS 结构' 'typedef struct _NDIS_BIND_PARAMETERS' 40 1
          P2 'NDIS_OPEN_PARAMETERS 结构' 'typedef struct _NDIS_OPEN_PARAMETERS' 18 1
          P2 'NdisOidRequest 原型' 'NdisOidRequest\(' 8 1
          P2 'NDIS_OID_REQUEST 结构' 'typedef struct _NDIS_OID_REQUEST' 40 1
          P2 'NDIS_INTERFACE_INFORMATION 结构' 'typedef struct _NDIS_INTERFACE_INFORMATION' 30 1
          P2 'OID_GEN_INTERFACE_INFO 定义' 'define OID_GEN_INTERFACE_INFO' 1 1
          P2 'OID_GEN_MAXIMUM_TOTAL_SIZE 定义' 'define OID_GEN_MAXIMUM_TOTAL_SIZE' 1 1
          P2 'OID_GEN_CURRENT_PACKET_FILTER 定义' 'define OID_GEN_CURRENT_PACKET_FILTER' 1 1
          P2 'OID_GEN_STATISTICS 定义' 'define OID_GEN_STATISTICS' 1 1
          P2 'OID_802_3_CURRENT_ADDRESS 定义' 'define OID_802_3_CURRENT_ADDRESS' 1 1
          P2 'NDIS_STATISTICS_INFO 结构' 'typedef struct _NDIS_STATISTICS_INFO' 26 1
          P2 'NDIS_LINK_STATE 结构' 'typedef struct _NDIS_LINK_STATE' 16 1
          P2 'NdisMIndicateStatusEx 原型' 'NdisMIndicateStatusEx\(' 6 1
          P2 'GetBestRoute2 声明' 'GetBestRoute2\(' 10 1
          P2 'MIB_IPFORWARD_ROW2 结构' 'typedef struct _MIB_IPFORWARD_ROW2' 26 1
          P2 'ConvertInterfaceLuidToIndex 声明' 'ConvertInterfaceLuidToIndex\(' 6 1
          P2 'NET_LUID 结构' 'typedef struct _NET_LUID' 10 1
          P2 'ExInitializeDriverRuntime 原型' 'ExInitializeDriverRuntime\(' 4 1
          P2 'NdisAllocateNetBufferAndNetBufferList 原型' 'NdisAllocateNetBufferAndNetBufferList\(' 8 1
          P2 'NdisMQueryAdapterInstanceName/接口辅助' 'NdisMQueryAdapterInstanceName\(' 6 1
          # 第四轮：NdisMRegisterMiniportDriver 在客体上返回 0xC0010005，必须知道
          # 这个名字；顺带把头部原件抓进工件，之后本地就能直接 grep，省掉往返。
          P2 'NDIS_STATUS 0xC00100xx 定义' 'define +NDIS_STATUS_[A-Z_0-9]+ +\(' 1 40
          P2 'NDIS_RUNTIME_VERSION_ 定义' 'define +NDIS_RUNTIME_VERSION_' 1 40
          P2 'NDIS_MINIPORT_DRIVER_CHARACTERISTICS_REVISION 定义' 'define +NDIS_SIZEOF_MINIPORT_DRIVER_CHARACTERISTICS_REVISION_' 1 20
          # 第五轮：控制设备改由 NdisRegisterDeviceEx 建（客体实测：DriverObject
          # 上已有自己的设备时 NdisMRegisterMiniportDriver 回 0xC0010005）。
          # NDIS_DEVICE_OBJECT_ATTRIBUTES.Header.Type 该填哪个常量？
          P2 'NDIS_OBJECT_TYPE_DEVICE_OBJECT_ATTRIBUTES 定义' 'define +NDIS_OBJECT_TYPE_DEVICE_OBJECT_ATTRIBUTES' 1 6
          P2 'NDIS_OBJECT_TYPE_DEFAULT 定义' 'define +NDIS_OBJECT_TYPE_DEFAULT' 1 6
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\wdk-src" | Out-Null
          # 注意 ntddndis.h 不在 km\ 而在 shared\：NDIS_OID_REQUEST 的结构体体、
          # NDIS_SIZEOF_OID_REQUEST_REVISION_1、NdisRequestSetInformation 枚举都在
          # 那里，ndis.h 只给出前向声明。第一次只从 km\ 取，结果一个都没带回来。
          foreach ($f in @('ndis.h', 'nblapi.h', 'miniportgeneralattributes.h', 'netioapi.h')) {
            $p = Join-Path $h $f
            if (Test-Path $p) { Copy-Item $p "$env:GITHUB_WORKSPACE\wdk-src\" -Force }
          }
          foreach ($f in @('ntddndis.h', 'ndis.h')) {
            $p = Join-Path "$env:WDKINC\shared" $f
            if (Test-Path $p) { Copy-Item $p "$env:GITHUB_WORKSPACE\wdk-src\" -Force }
          }
          # NDIS_OID_REQUEST 的结构体体也不在 ntddndis.h（那里只有前向声明），
          # 而在 ndis/oidrequest.h —— ndis.h:4441 就是 include 它。协议边要下发
          # OID_GEN_CURRENT_PACKET_FILTER，必须先拿到这个结构。
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\wdk-src\ndis" | Out-Null
          foreach ($f in @('oidrequest.h', 'types.h', 'status.h')) {
            $p = Join-Path "$env:WDKINC\shared\ndis" $f
            if (Test-Path $p) { Copy-Item $p "$env:GITHUB_WORKSPACE\wdk-src\ndis\" -Force }
          }
          # 上一轮那段递归查找一行输出都没有：PowerShell 里裸的 { ... } 只是脚本块
          # 字面量，求值完就丢，根本没执行 —— 必须写成 & { ... }。
          # 这一轮不猜目录：ndis.h 就在 km\ 下，它自己 #include <ndis/xxx.h>，
          # 所以 <ndis/oidrequest.h> 必然解析到 km\ndis\。整个目录搬回来。
          "`n=== km\ndis 目录 ===" | Tee-Object -FilePath $log -Append
          $ndis_sub = Join-Path $h 'ndis'
          if (Test-Path $ndis_sub) {
            Get-ChildItem $ndis_sub -Filter '*.h' -ErrorAction SilentlyContinue | ForEach-Object {
              "$($_.Name) = $($_.Length) B" | Tee-Object -FilePath $log -Append
              Copy-Item $_.FullName "$env:GITHUB_WORKSPACE\wdk-src\ndis\" -Force
            }
          } else { 'km\ndis 不存在' | Tee-Object -FilePath $log -Append }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\wdk-src\ndis\oidrequest.h")) {
            'oidrequest.h 仍未到手' | Tee-Object -FilePath $log -Append
          }
          Copy-Item "$env:WDKINC\shared\ndis\version.h" "$env:GITHUB_WORKSPACE\wdk-src\ndis-version.h" -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:GITHUB_WORKSPACE\wdk-src" -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Out-String | Tee-Object -FilePath $log -Append

      # 第三轮：两个编译期问题只能让编译器回答。
      #   · iwanmp 同时是微型端口与协议驱动，工程该定义哪几个版本宏？
      #     ndis.h 里 NDIS_MINIPORT_DRIVER 撞上了"reserved"，但那段被
      #     #ifdef NETCX_ADAPTER_2 包着；不试编译就是在猜。
      #   · 内核态还有没有可取路由的 API（GetBestRoute2 那一族）？这决定
      #     下一跳是由驱动自己查路由，还是由控制面在建会话时算好传进来。
      - name: 核对 iwanmp 的 NDIS 版本宏与路由 API 可用性
        continue-on-error: true
        shell: pwsh
        run: |
          $msvc = Get-ChildItem "$env:VSDIR\VC\Tools\MSVC" -Directory |
                  Sort-Object Name | Select-Object -Last 1
          $cl = Get-ChildItem $msvc.FullName -Recurse -Filter cl.exe |
                Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $incs = @("$env:WDKINC\km", "$env:WDKINC\km\crt", "$env:WDKINC\shared",
                    "$env:WDKINC\ucrt", "$($msvc.FullName)\include") |
                  Where-Object { Test-Path $_ } | ForEach-Object { "/I$_" }
          $log = "$env:GITHUB_WORKSPACE\mp-macro.log"

          # 只打印宏解析结果，不参与链接
          @'
          #include <ndis.h>
          #define IWAN_S(x) #x
          #define IWAN_T(x) IWAN_S(x)
          #pragma message("IWANMP miniport_ver=" IWAN_T(NDIS_MINIPORT_MAJOR_VERSION) "." IWAN_T(NDIS_MINIPORT_MINOR_VERSION))
          #pragma message("IWANMP protocol_ver=" IWAN_T(NDIS_PROTOCOL_MAJOR_VERSION) "." IWAN_T(NDIS_PROTOCOL_MINOR_VERSION))
          #pragma message("IWANMP legacy_miniport=" IWAN_T(NDIS_LEGACY_MINIPORT) " legacy_protocol=" IWAN_T(NDIS_LEGACY_PROTOCOL))
          #pragma message("IWANMP support630=" IWAN_T(NDIS_SUPPORT_NDIS630) " support683=" IWAN_T(NDIS_SUPPORT_NDIS683))
          #pragma message("IWANMP ndis_wdm=" IWAN_T(NDIS_WDM) " miniport_driver=" IWAN_T(NDIS_MINIPORT_DRIVER))
          int iwan_mp_probe_anchor(void);
          int iwan_mp_probe_anchor(void) { return 0; }
          '@ | Set-Content -Encoding ascii win-driver\mp_probe.c

          # 内核态能不能取路由：直接编译一段真调用，报错即答案
          @'
          #include <ndis.h>
          #include <netioapi.h>
          NTSTATUS iwan_mp_probe_route(void)
          {
              MIB_IPFORWARD_ROW2 row;
              SOCKADDR_INET src, dst;
              NET_LUID luid;
              NET_IFINDEX idx;

              RtlZeroMemory(&row, sizeof(row));
              RtlZeroMemory(&src, sizeof(src));
              RtlZeroMemory(&dst, sizeof(dst));
              RtlZeroMemory(&luid, sizeof(luid));
              idx = ConvertInterfaceLuidToIndex(&luid);
              ConvertInterfaceIndexToLuid(idx, &luid);
              return GetBestRoute2(NULL, idx, NULL, &dst, 0, &row, &src);
          }
          '@ | Set-Content -Encoding ascii win-driver\mp_probe_netio.c

          $sets = @(
            @{ n = 'A: NDIS630 + NDIS630_MINIPORT'; d = @('/DNDIS630', '/DNDIS630_MINIPORT', '/DNDIS_WDM') },
            @{ n = 'B: NDIS_MINIPORT_DRIVER + 620/683_MINIPORT'; d = @('/DNDIS_MINIPORT_DRIVER', '/DNDIS620_MINIPORT', '/DNDIS683_MINIPORT', '/DNDIS_WDM') },
            @{ n = 'C: 只有 NDIS630'; d = @('/DNDIS630') }
          )
          foreach ($s in $sets) {
            "`n=== 宏解析 $($s.n) ===" | Tee-Object -FilePath $log -Append
            $cargs = @('/nologo', '/kernel', '/c', '/Zs', '/std:c11', '/W4', '/WX-',
                       '/Iwin-driver', '/Isrc\common') + $incs + $s.d +
                     @('/D_AMD64_', 'win-driver\mp_probe.c')
            & $cl.FullName @cargs 2>&1 | Tee-Object -FilePath $log -Append
          }
          "`n=== 内核态路由 API（netioapi.h） ===" | Tee-Object -FilePath $log -Append
          $rargs = @('/nologo', '/kernel', '/c', '/Zs', '/std:c11', '/W4', '/WX-',
                     '/Iwin-driver', '/Isrc\common') + $incs +
                   @('/DNDIS630', '/DNDIS630_MINIPORT', '/DNDIS_WDM', '/D_AMD64_',
                     'win-driver\mp_probe_netio.c')
          & $cl.FullName @rargs 2>&1 | Tee-Object -FilePath $log -Append

          $root = Split-Path $env:WDKINC -Parent
          function P3($title, $pattern, $ctx, $max) {
            "`n=== $title ===" | Tee-Object -FilePath $log -Append
            Get-ChildItem $root -Recurse -Filter '*.h' -ErrorAction SilentlyContinue |
              Select-String -Pattern $pattern -ErrorAction SilentlyContinue |
              Select-Object -First $max | ForEach-Object {
                "$($_.Filename):$($_.LineNumber): $($_.Line)"
                if ($ctx -gt 0) { Get-Content $_.Path | Select-Object -Skip $_.LineNumber -First $ctx }
              } | Out-String -Width 240 | Tee-Object -FilePath $log -Append
          }
          P3 'PROTOCOL_RECEIVE_NET_BUFFER_LISTS 原型' 'PROTOCOL_RECEIVE_NET_BUFFER_LISTS\)' 10 1
          P3 'PROTOCOL_BIND_ADAPTER_EX 原型' 'PROTOCOL_BIND_ADAPTER_EX\)' 10 1
          P3 'PROTOCOL_SEND_NET_BUFFER_LISTS_COMPLETE 原型' 'PROTOCOL_SEND_NET_BUFFER_LISTS_COMPLETE\)' 8 1
          P3 'NDIS_STATISTICS_INFO 结构' '_NDIS_STATISTICS_INFO$' 30 1
          P3 'NDIS_LINK_STATE 结构' '_NDIS_LINK_STATE$' 18 1
          P3 '对象类型 GUID：注册属性' 'NDIS_OBJECT_TYPE_MINIPORT_ADAPTER_REGISTRATION_ATTRIBUTES' 2 3
          P3 '对象类型 GUID：一般属性' 'NDIS_OBJECT_TYPE_MINIPORT_ADAPTER_GENERAL_ATTRIBUTES' 2 3
          P3 '对象类型 GUID：微型端口驱动特征' 'NDIS_OBJECT_TYPE_MINIPORT_DRIVER_CHARACTERISTICS' 2 3
          P3 '对象类型 GUID：协议驱动特征' 'NDIS_OBJECT_TYPE_PROTOCOL_DRIVER_CHARACTERISTICS' 2 3
          P3 '对象类型 GUID：NBL 池参数' 'NDIS_OBJECT_TYPE_NET_BUFFER_LIST_POOL_PARAMETERS' 2 3
          P3 '统计支持的位' 'NDIS_STATISTICS_XMIT_OK_SUPPORTED' 2 3
          P3 'MacOptions 位' 'define NDIS_MAC_OPTION_' 2 12
          P3 'NdisMediumIP 与物理介质' 'NdisMediumIP$|NdisPhysicalMediumUnspecified' 2 4
          P3 'IF_TYPE_PROP_VIRTUAL' 'define IF_TYPE_PROP_VIRTUAL' 2 2
          P3 '以太类型常量' 'define ETHERTYPE_IP$|define ETHERTYPE_ARP$|define ETHERTYPE_IPV6$' 2 4
          P3 'ExInitializeDriverRuntime' 'ExInitializeDriverRuntime\(' 8 1
          P3 'NdisGetVersion 原型' 'NdisGetVersion\(' 6 1
          P3 'NdisAllocateNetBufferListPool/NdisFreeNetBufferList' 'NdisAllocateNetBufferListPool\(|NdisFreeNetBufferList\(' 8 2
          P3 'NDIS_DEFAULT_PORT_NUMBER' 'define NDIS_DEFAULT_PORT_NUMBER' 2 2

      # 先只编译：/t:ClCompile 不链接、不校验 INF，即使后面两步有问题也能拿到
      # 完整的 C 侧诊断（上一轮就是被 InfVerif 挡在编译之前，白等一轮）。
      - name: msbuild 只编译（不链接）
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:MSBUILD 'win-driver\iwan.vcxproj' /nologo /v:normal /t:ClCompile `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
              "/p:OutDir=$env:GITHUB_WORKSPACE\build\x64\Release\" 2>&1 |
              Tee-Object -FilePath cl-build.log
          "ClCompile 退出码=$LASTEXITCODE"

      - name: msbuild 驱动
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:MSBUILD 'win-driver\iwan.vcxproj' /nologo /v:normal `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
              "/p:OutDir=$env:GITHUB_WORKSPACE\build\x64\Release\" 2>&1 |
              Tee-Object -FilePath msbuild.log
          "msbuild 退出码=$LASTEXITCODE"

      # NDIS 平面（小型端口 + 协议驱动）。与 iwan.sys 各自独立：一个失败不影响
      # 另一个的产物，判据仍然是各自的 .sys 是否存在。
      - name: msbuild iwanmp（NDIS 平面）
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:MSBUILD 'win-driver\iwanmp.vcxproj' /nologo /v:normal `
              /p:Configuration=Release /p:Platform=x64 `
              "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
              "/p:OutDir=$env:GITHUB_WORKSPACE\build\x64\Release\" 2>&1 |
              Tee-Object -FilePath msbuild-mp.log
          "msbuild-mp 退出码=$LASTEXITCODE"

      - name: 取 x64 devcon.exe（虚拟机建承载网卡用）
        if: always()
        shell: pwsh
        run: |
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $dev = Get-ChildItem "$sdk\Tools" -Recurse -Filter devcon.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          if ($dev) {
            Copy-Item $dev.FullName "$env:GITHUB_WORKSPACE\out\devcon.exe"
            "已取到 $($dev.FullName)"
          } else {
            "runner 上没找到 x64 devcon.exe"
          }

      # 上面几步都是 continue-on-error，所以"工作流成功"从来不等于"编译成功"：
      # 曾经带着一个 C2220 报 success，而工件里没有 iwan.sys。判据只能是产物。
      - name: 断言两个 .sys 真的产出了
        if: always()
        shell: pwsh
        run: |
          $bad = 0
          foreach ($n in @('iwan.sys', 'iwanmp.sys')) {
            $sys = "$env:GITHUB_WORKSPACE\build\x64\Release\$n"
            if (Test-Path $sys) {
              "$n 存在：$((Get-Item $sys).Length) 字节"
            } else {
              "编译没有产出 $n —— 本次构建判为失败"
              $bad = 1
            }
          }
          if ($bad -ne 0) { exit 1 }

      # MSVC 静态分析（PREfast /analyze）。刻意用 cl.exe 直接跑而不是 msbuild 的
      # 属性：属性名写错会被静默忽略，而 /analyze:log 只有真的分析了才会写出 XML,
      # 所以"XML 是否存在"本身就是阳性对照（不能只看有没有告警）。
      - name: cl 静态分析（/analyze）
        continue-on-error: true
        shell: pwsh
        run: |
          $msvc = Get-ChildItem "$env:VSDIR\VC\Tools\MSVC" -Directory |
                  Sort-Object Name | Select-Object -Last 1
          $cl = Get-ChildItem $msvc.FullName -Recurse -Filter cl.exe |
                Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          "CL=$($cl.FullName)"
          # WDK 与 STL 一律标成外部头：只做这一件事的 /external:I /external:W0
          # 见下面的 $common。注意 /Zs 语法检查那两步仍用 /I（它要的是同一批
          # 头能找到即可，不必区分内外）。
          $incs = @("$env:WDKINC\km", "$env:WDKINC\km\crt", "$env:WDKINC\shared",
                    "$env:WDKINC\ucrt", "$($msvc.FullName)\include") |
                  Where-Object { Test-Path $_ } | ForEach-Object { "/external:I$_" }
          New-Item -ItemType Directory -Force -Path analyze-obj | Out-Null
          # /external:W0 让上面标成外部头的 WDK/STL 头不再贡献告警：
          # 实测 700 余条全部出自头部自身（C4324 结构对齐填充、C28160 必成功
          # 池分配的注解自检、C6387 ExAllocatePoolZero 可能返回 0、C28301
          # POOL_FLAGS 首声明无注解、C28252/C28253 MmGetSystemRoutineAddress
          # 注解不一致、C28230/C28285 ntddk.h 的 WHEA 注解表达式引用不存在
          # 的成员、C6553 注解用在值类型上）。真实构建里这批头部被
          # /FI shared\warning.h 压住，手写分析命令行没有那一步，所以必须
          # 显式标外部，否则我们自己的缺陷永远淹在噪声里。
          # 真实构建（iwan.vcxproj）用 /FI shared\warning.h 压住 WDK 头自身的
          # 告警，这里照抄同一步，免得"分析口径"与"构建口径"分叉。
          $wdkhdr = @()
          if (Test-Path "$env:WDKINC\shared\warning.h") {
            $wdkhdr = @("/FI$env:WDKINC\shared\warning.h")
          } else {
            "WDK warning.h 不存在，跳过 /FI"
          }
          $common = @('/nologo', '/kernel', '/c', '/std:c11', '/W4', '/WX-',
                      '/analyze', '/external:W0',
                      "/Fo$env:GITHUB_WORKSPACE\analyze-obj\",
                      '/Iwin-driver', '/Isrc\common') + $incs + $wdkhdr + @('/D_AMD64_')
          $sets = @(
            @{ log = 'analysis-wfp.xml'; defs = @('/DNDIS630');
               src = @('win-driver\iwan_win_drv.c', 'win-driver\iwan_win_session.c',
                       'win-driver\iwan_win_wfp.c', 'win-driver\iwan_win_frame.c') },
            @{ log = 'analysis-mp.xml'; defs = @('/DNDIS630', '/DNDIS_WDM', '/DIWAN_WIN_PLANE_MP');
               src = @('win-driver\iwan_win_proto.c', 'win-driver\iwan_win_mpdata.c',
                       'win-driver\iwan_win_drv.c', 'win-driver\iwan_win_session.c',
                       'win-driver\iwan_win_frame.c') },
            @{ log = 'analysis-mp-miniport.xml';
               defs = @('/DNDIS_MINIPORT_DRIVER', '/DNDIS620_MINIPORT', '/DNDIS683_MINIPORT',
                        '/DNDIS_WDM', '/DIWAN_WIN_PLANE_MP');
               src = @('win-driver\iwan_win_mp.c') })
          foreach ($s in $sets) {
            $a = $common + $s.defs + @("/analyze:log", $s.log) + $s.src
            & $cl.FullName @a 2>&1 | Tee-Object -FilePath ($s.log -replace '\.xml$', '.log')
            "analyze $($s.log) 退出码=$LASTEXITCODE"
          }

      # 阳性对照：XML 不存在就说明 /analyze 根本没跑（或者提前失败），此时"0 告警"
      # 毫无意义。这一步刻意不 continue-on-error，让它在工作流结论上显形。
      - name: 打印 NDIS 小型端口通用属性结构（实验用）
        # 本仓库能拿到的 ndis.h 快照截断在 15076 行，正好缺这个结构；而
        # MAC 数组的字段名各版本不同，写错就是 C2039。用它换掉 mp.c 里
        # 按偏移定位 MAC 的临时写法。
        if: always()
        shell: pwsh
        run: |
          $h = Join-Path $env:WDKINC 'km\ndis.h'
          if (-not (Test-Path $h)) { "缺少 $h"; exit 0 }
          $m = Select-String -Path $h -Pattern 'typedef\s+struct\s+_NDIS_MINIPORT_ADAPTER_GENERAL_ATTRIBUTES' |
               Select-Object -First 1
          if (-not $m) { '没找到结构定义'; exit 0 }
          Get-Content $h | Select-Object -Skip ($m.LineNumber - 1) -First 60

      - name: 断言静态分析真的跑了
        if: always()
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in @('analysis-wfp.xml', 'analysis-mp.xml', 'analysis-mp-miniport.xml')) {
            if (Test-Path $f) {
              "$f 存在：$((Get-Item $f).Length) 字节"
            } else {
              "$f 不存在 —— 静态分析没跑成，本次结果不可信"
              $bad = 1
            }
          }
          if ($bad -ne 0) { exit 1 }

      # 把"我们自己的源码零缺陷"从口号变成闸门：XML 里凡 FILEPATH 带 Windows Kits
      # 的，都是 WDK 头自身的注解自检（C28160 必成功池分配、C6387 分配器可能返回 0、
      # C28301 POOL_FLAGS 首声明无注解、C28252/C28253 MmGetSystemRoutineAddress 的
      # IRQL 注解前后不一致、C28230/C28285 WHEA 注解引用不存在的成员、C6553 注解用
      # 在值类型上）—— 那是微软的头，我们既不能也不该改；能保证的是它一条都不来自
      # win-driver/。实测 /external:W0 能压住编译器级告警（C4324 已归零），但压不住
      # 代码分析级的注解自检，所以这道闸门按来源文件而不是按告警码来判。
      - name: 断言我们自己的源码零缺陷
        if: always()
        shell: pwsh
        run: |
          $hdrCodes = @{}
          $ours = @()
          foreach ($f in @('analysis-wfp.xml', 'analysis-mp.xml', 'analysis-mp-miniport.xml')) {
            if (-not (Test-Path $f)) { "跳过不存在的 $f"; continue }
            [xml]$x = Get-Content -Raw $f
            foreach ($d in $x.SelectNodes('/DEFECTS/DEFECT')) {
              $file = $d.SelectSingleNode('SFA/FILEPATH').InnerText
              $name = $d.SelectSingleNode('SFA/FILENAME').InnerText
              $line = $d.SelectSingleNode('SFA/LINE').InnerText
              $code = $d.SelectSingleNode('DEFECTCODE').InnerText.Trim()
              if ($file -match 'Windows Kits') {
                $k = "$code $name`:$line"
                if (-not $hdrCodes.ContainsKey($k)) { $hdrCodes[$k] = 0 }
                $hdrCodes[$k] = $hdrCodes[$k] + 1
              } else {
                $ours += "$file$name`:$line C$code $($d.SelectSingleNode('DESCRIPTION').InnerText.Trim())"
              }
            }
          }
          "WDK 头自身的注解自检（不是我们的代码，只能记录）："
          if ($hdrCodes.Count -eq 0) { "  无" }
          foreach ($k in ($hdrCodes.Keys | Sort-Object)) {
            "  {0,-30} x{1}" -f $k, $hdrCodes[$k]
          }
          if ($ours.Count -gt 0) {
            "我们自己的源码有 $($ours.Count) 条缺陷："
            $ours | ForEach-Object { "  $_" }
            exit 1
          }
          "我们自己的源码：0 条缺陷"

      - name: 回传产物与日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-driver-x64
          path: |
            build/x64/Release/iwan.sys
            build/x64/Release/iwan.pdb
            build/x64/Release/iwanmp.sys
            build/x64/Release/iwanmp.pdb
            win-driver/iwanmp.inf
            wdk-src/**
            out/devcon.exe
            analysis-*.xml
            **/*.log
          if-no-files-found: warn
